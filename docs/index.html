<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>化療給藥情境練習</title>
<style>
:root{
  color-scheme:light;
  --bg:#f6f7f9; --card:#ffffff; --ink:#14171c; --ink2:#4b5260; --muted:#7a8190; --line:#dfe3ea;
  --accent:#2a78d6; --accent-ink:#ffffff; --soft:#eaf2fc;
  --ok:#0f7a3d; --ok-bg:#e6f4ec; --bad:#b42318; --bad-bg:#fdecea; --warn-bg:#fff6e0; --warn:#8a5a00;
  --g-known:#2a78d6; --g-over:#eb6834; --g-unsure:#1baf7a; --g-gap:#eda100; --g-na:#c9ced8;
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121417; --card:#1b1e23; --ink:#eef0f3; --ink2:#c2c7d0; --muted:#8d94a1; --line:#2d323a;
    --accent:#3987e5; --accent-ink:#ffffff; --soft:#1d2a3b;
    --ok:#5fd08f; --ok-bg:#15291e; --bad:#ff8a80; --bad-bg:#33191a; --warn-bg:#2e2510; --warn:#f1c25a;
    --g-known:#3987e5; --g-over:#d95926; --g-unsure:#199e70; --g-gap:#c98500; --g-na:#3a404a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121417; --card:#1b1e23; --ink:#eef0f3; --ink2:#c2c7d0; --muted:#8d94a1; --line:#2d323a;
  --accent:#3987e5; --accent-ink:#ffffff; --soft:#1d2a3b;
  --ok:#5fd08f; --ok-bg:#15291e; --bad:#ff8a80; --bad-bg:#33191a; --warn-bg:#2e2510; --warn:#f1c25a;
  --g-known:#3987e5; --g-over:#d95926; --g-unsure:#199e70; --g-gap:#c98500; --g-na:#3a404a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px 16px 96px}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
.top h1{font-size:17px;margin:0;flex:1}
.prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.act{font-size:13px;color:var(--muted);letter-spacing:.04em}
h2{font-size:19px;margin:4px 0 10px}
.ref{font-size:12px;color:var(--muted)}
.pic{width:100%;max-width:640px;margin-left:auto!important;margin-right:auto!important;aspect-ratio:3/2;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;margin:6px 0 12px;overflow:hidden;border:1px dashed var(--line)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.stem{white-space:pre-line;font-size:16.5px;margin:0 0 12px}
.ask{font-size:14px;color:var(--ink2);margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px;min-height:44px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.sel{border-color:var(--accent);background:var(--soft);font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
.opt{display:block;width:100%;text-align:left;margin:0 0 8px;padding:12px 14px}
.opt.unk{color:var(--ink2);border-style:dashed}
.conf button{flex:1}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:15px}
.banner b{display:block;margin-bottom:2px}
.steps .opt .n{display:inline-block;min-width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);text-align:center;font-size:14px;line-height:26px;margin-right:8px}
.steps .opt .n.e{background:var(--line);color:var(--muted)}
.drag .dr{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 8px 10px 10px;margin:0 0 8px;touch-action:none;user-select:none;cursor:grab;position:relative}
.drag .dr .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);text-align:center;font-size:14px;line-height:26px}
.drag .dr .tx{flex:1}
.drag .dr .mv{display:flex;flex-direction:column;gap:4px}
.drag .dr .mv button{min-height:30px;padding:2px 10px;font-size:12px}
.drag .dr.dragging{z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.18);border-color:var(--accent);cursor:grabbing}
.drag .dr.over{border-color:var(--accent);border-style:dashed}
.shelf{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0;margin:0 0 10px;border-bottom:1px solid var(--line)}
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:10px}
.oc{display:flex;flex-direction:column;gap:6px;padding:6px;text-align:center;font-size:14px;line-height:1.35}
.oc img,.oc .ph{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:30px}
.mi{font-size:14px;padding:3px 0}.mi.ok{color:var(--ok)}.mi.miss{color:var(--bad)}
.drop.bad{border-color:var(--bad)}
.sc{flex:none;width:76px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center;font-size:12px;line-height:1.3;touch-action:none;user-select:none;cursor:grab}
.sc img,.sc .ph{width:100%;aspect-ratio:1/1;object-fit:contain;border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:4px}
.sc[data-pk]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.sc.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.9;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:var(--card)}
.drop.over{border-color:var(--accent);background:var(--soft)}
.drop .dt{font-weight:600;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border-radius:99px;padding:2px 4px 2px 10px;font-size:13px}
.chip button{min-height:26px;padding:0 8px;border:0;background:transparent;font-size:15px}
.anim2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px;margin:4px 0 6px}
.psec{width:100%;height:auto;border:1px solid var(--line);border-radius:10px;background:#fbfaf8}
.psec .ndl{animation:ndl 2.2s ease-in .3s both}
@keyframes ndl{from{transform:translate(var(--dx),var(--dy))}to{transform:translate(0,0)}}
@media (prefers-reduced-motion:reduce){.psec .ndl{animation:none}}
canvas{width:100%;aspect-ratio:1/1;border-radius:10px;touch-action:none;display:block;background:#f3d9c6}
.hint{font-size:14px;color:var(--ink2);margin:8px 0}
.rv{border-top:1px solid var(--line);padding:10px 0}
.rv:first-of-type{border-top:0}
.rv .h{display:flex;gap:8px;align-items:baseline}
.tag{font-size:12px;border-radius:99px;padding:1px 8px;white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.wait{background:var(--soft);color:var(--ink2)}
.rv p{margin:4px 0;font-size:14.5px;color:var(--ink2)}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;margin:8px 0 4px}
.cell{border-radius:8px;padding:6px 4px;text-align:center;font-size:12px;line-height:1.3;color:#fff;font-weight:600}
.cell small{display:block;font-weight:400;opacity:.95}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink2);margin:8px 0}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:14px;height:14px;border-radius:4px;display:inline-block}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:84px}
label.ck{display:flex;gap:8px;align-items:flex-start;padding:6px 0;font-size:15px}
label.ck input{margin-top:5px;width:18px;height:18px}
.grp{font-size:13px;color:var(--muted);margin:10px 0 2px}
.status{border-radius:10px;padding:10px 12px;margin-top:10px;font-size:15px}
.status.ok{background:var(--ok-bg);color:var(--ok)} .status.warn{background:var(--warn-bg);color:var(--warn)} .status.bad{background:var(--bad-bg);color:var(--bad)}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.foot .in{max-width:760px;margin:0 auto;display:flex;justify-content:flex-end;gap:8px}
.big{font-size:28px;font-weight:700}
/* 「現在要做」與條列說明 */
.now{color:var(--accent);font-weight:700;font-size:16px;line-height:1.45;margin:2px 0 8px}
.pts{margin:4px 0 10px;padding-left:1.3em;font-size:15px;line-height:1.55;color:var(--ink2)}
.pts li{margin:2px 0}
.adesc{background:var(--soft);border-radius:10px;padding:10px 12px;margin:6px 0 12px}
.adesc .pts{margin-bottom:0}
/* 情境大圖還沒生：縮成一行細條 */
.pic.none{aspect-ratio:auto;min-height:0;padding:6px 10px;justify-content:flex-start;font-size:13px}
/* 進度 */
.pgw{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.pgw .prog{flex:1;margin:0}
.pgw span{font-size:13px;color:var(--muted);white-space:nowrap}
/* 成果卡沒圖時改矮卡 */
.oc .ph.sm{aspect-ratio:auto;height:34px;font-size:20px}
/* 圖卡選項 */
.icards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));max-width:680px;margin:0 auto 8px;gap:8px}   /* 手機直拿兩欄，平板電腦自動多欄、圖不無限放大 */
.ic{display:flex;flex-direction:column;gap:6px;padding:6px;text-align:center;font-size:clamp(13.5px,3.7vw,16px);line-height:1.35;word-break:break-word}
.ic img,.ic .ph{width:100%;aspect-ratio:1/1;object-fit:contain;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:40px;border:1px solid var(--line)}
.ic .ph{background:var(--soft)}
.ic.sel{box-shadow:0 0 0 2px var(--accent)}
/* 排順序：左右兩欄 */
.ocols{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.ocol{display:flex;flex-direction:column;gap:6px;border:2px dashed var(--line);border-radius:12px;padding:6px;min-height:160px;background:var(--bg)}
.ocol.R{border-color:var(--accent);background:var(--card)}
.ocol.over{background:var(--soft)}
.oh{font-size:13px;font-weight:700;color:var(--muted);text-align:center}
.ocol.R .oh{color:var(--accent)}
.oe{font-size:13px;color:var(--muted);text-align:center;padding:14px 4px}
.stc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:clamp(13.5px,3.6vw,16px);line-height:1.4;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;word-break:break-word}
.stc.in{display:flex;gap:6px;align-items:flex-start;border-color:var(--accent);padding:6px}
.stc.in .n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);text-align:center;font-size:12px;line-height:22px;font-weight:700;margin-top:1px}
.stc.in .tx{flex:1}
.stc .x{flex:none;min-height:0;width:26px;height:26px;padding:0;border:0;background:transparent;color:var(--muted);font-size:17px;line-height:26px}
.stc.lift{opacity:.3}
.stc.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.95;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.ins{height:4px;border-radius:2px;background:var(--accent);margin:-1px 0}
.dz{flex:1 0 auto;min-height:88px;display:flex;align-items:center;justify-content:center;text-align:center;border:2px dashed var(--accent);border-radius:10px;color:var(--accent);font-size:14px;line-height:1.4;background:var(--soft);opacity:.75}   /* 右欄最下方的放置區，撐滿剩下的高度 */
.dz.on{opacity:1;box-shadow:0 0 0 2px var(--accent) inset}
@media (max-width:480px){ .stc.in{flex-wrap:wrap;row-gap:2px} .stc.in .tx{order:3;flex-basis:100%} .stc.in .x{margin-left:auto;height:22px;line-height:22px} }   /* 手機：編號與 × 在上，文字用整張卡寬 */
/* 用物準備第三步：滿版，一頁一個關鍵成果 */
.fs{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;height:100vh;height:100dvh;padding:0 0 env(safe-area-inset-bottom)}
.fhd{padding:10px 12px 4px}
.fhd h2{margin:2px 0 4px;font-size:18px;line-height:1.35}
.fkn{font-size:13px;color:var(--accent);font-weight:600}
.fdo{font-size:15px;color:var(--ink2)}
.fbx{flex:none;margin:4px 12px 6px;border:2px dashed var(--accent);border-radius:12px;background:var(--card);padding:8px;height:92px;overflow-y:auto;display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px}
.fbx.over,.fbx.pk{background:var(--soft)}
.fsh{flex:1;min-height:0;overflow-y:auto;display:grid;gap:6px;justify-content:center;align-content:start;padding:2px 12px 6px;--s:72px}
.fc{width:calc(var(--s) + 8px);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px;text-align:center;font-size:12px;line-height:1.25;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.fc img,.fc .ph{width:var(--s);height:var(--s);object-fit:contain;border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:calc(var(--s) * .4)}
.fc span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;height:30px;margin-top:3px;word-break:break-word}
.fc[data-pk]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.fc.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.92;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.fft{flex:none;display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--line);background:var(--card)}
.fft button{flex:1}
@media (max-width:480px){
  main{padding:12px 10px 96px}
  .card{padding:14px 12px}
  .foot .in button{flex:1}
}
</style>
</head>
<body>
<main id="app"><p>載入中…</p></main>
<div class="foot" id="foot" hidden><div class="in" id="footin"></div></div>
<script>
/* 新進護理師化療給藥到職訓練｜實體課 2D 互動情境
   題目資料：data/script.json（由 _build.py 從腳本 md 產生；不要手改）
   ENDPOINT：作答回傳的 Google Apps Script 網址（apps-script/Code.gs）；空白時只在本頁顯示 */
const ENDPOINT = "https://script.google.com/macros/s/AKfycbzHpVJHrzP-dC0UWTtxjLVG7BKCxPn28-WUCjH69VMhk4u8_SnFYLZkJcPTmvwgMsaA/exec";
const VERSION = "onboard-v0.5";
const $app = document.getElementById("app"), $foot = document.getElementById("foot"), $footin = document.getElementById("footin");
let D, S;   // D＝題目資料；S＝作答狀態
const CONF = [["high","很確定"],["mid","有點把握"],["low","不確定"]];
const GAPCLS = {
  known:{c:"var(--g-known)",l:"已經會",i:"✓",d:"很確定，而且答對"},
  over:{c:"var(--g-over)",l:"以為會",i:"!",d:"這一幕選很確定，卻答錯——最要注意"},
  unsure:{c:"var(--g-unsure)",l:"會但沒把握",i:"?",d:"沒把握，但答對"},
  gap:{c:"var(--g-gap)",l:"還不會",i:"✗",d:"沒把握或選不知道，而且答錯"}};

function now(t){ return `<div class="now">現在要做：${t}</div>` }   // 每個畫面頂端的一行「現在要做」
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function rng(seed){let h=2166136261;for(const c of seed)h=Math.imul(h^c.charCodeAt(0),16777619);return()=>{h+=0x6D2B79F5;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,seed){const a=arr.slice(),r=rng(seed);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function foot(btns){ $footin.innerHTML=""; if(!btns||!btns.length){$foot.hidden=true;return} $foot.hidden=false; $footin.innerHTML=""; btns.forEach(b=>$footin.appendChild(b)); }
function btn(txt,cls,fn,dis){const b=document.createElement("button");b.textContent=txt;if(cls)b.className=cls;b.onclick=fn;if(dis)b.disabled=true;return b}
function pic(img){ if(img && D.images && D.images[img]) return `<div class="pic"><img src="images/${esc(D.images[img])}" alt=""></div>`; return img?`<div class="pic none">🖼️ 圖卡 ${esc(img)}（製作中）</div>`:"" }
function save(){ try{ localStorage.setItem("onboard_state",JSON.stringify(S)) }catch(e){} }
function gapClass(a){ if(!a) return null; if(a.correct) return a.conf==="high"?"known":"unsure"; return (a.conf==="high"&&!a.unknown)?"over":"gap" }
function itemById(id){return D.items.find(x=>x.id===id)}
function deferredTo(id){const c=D.conseq.find(c=>c.src===id);if(!c)return null;const t=itemById(c.target);return t&&t.act!==itemById(id).act?t.act:null}

fetch("data/script.json",{cache:"no-cache"}).then(r=>r.json()).then(d=>{D=d;
  let old=null; try{old=JSON.parse(localStorage.getItem("onboard_state")||"null")}catch(e){}
  if(old&&old.ver===VERSION&&!old.sent&&old.idx>0){ S=old; renderResume() } else { newState(); renderStart() }
}).catch(e=>{$app.innerHTML=`<div class="card">題目載入失敗，請重新整理。<br><small>${esc(e)}</small></div>`});

function newState(){ S={ver:VERSION,code:"",idx:-1,answers:{},started_at:null,phase:"start",reviewed:{}} }

function renderResume(){
  $app.innerHTML=`<div class="card"><h2>要接著上次的進度嗎？</h2><p>你上次做到第 ${S.idx+1} 題。</p></div>`;
  foot([btn("重新開始","",()=>{newState();save();renderStart()}),btn("接著做","primary",()=>route())]);
}

/* ---------- 開始 ---------- */
function renderStart(){
  $app.innerHTML=`
  <div class="top"><h1>化療給藥情境練習</h1></div>
  <div class="card">
    <h2>走一遍，找出你自己的差距</h2>
    ${now("填員工編號，按開始")}
    <ul class="pts"><li>陪一位病人走完三幕，約 20 分鐘</li><li>每一幕開始前，先評估自己有多確定</li><li>不會就選「不知道」，不扣分</li><li>最後寫下你的差距，老師會依全班的差距帶練</li></ul>
    <label for="emp"><b>員工編號（6 碼數字）</b></label>
    <input id="emp" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" spellcheck="false" placeholder="例：012345">
    <div class="hint" id="cnt">已填 0 / 6 碼</div>
  </div>`;
  const inp=document.getElementById("emp"), cnt=document.getElementById("cnt"); let comp=false;
  const go=btn("開始","primary",()=>{S.code=inp.value;S.started_at=new Date().toISOString();S.idx=0;S.phase="intro";save();route()},true);
  const norm=()=>{ if(comp) return; let v=inp.value.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/\D/g,"").slice(0,6); if(v!==inp.value) inp.value=v; cnt.textContent=`已填 ${v.length} / 6 碼`; go.disabled=v.length!==6 };
  inp.addEventListener("compositionstart",()=>comp=true); inp.addEventListener("compositionend",()=>{comp=false;norm()}); inp.addEventListener("input",norm);
  foot([go]);
}

/* ---------- 流程 ---------- */
function route(){
  if(S.phase==="intro") return renderIntro();
  if(S.phase==="actTitle") return renderActTitle();
  if(S.phase==="item") return renderItem();
  if(S.phase==="review") return renderReview();
  if(S.phase==="final") return renderFinal();
  if(S.phase==="done") return renderDone();
}
function progress(){ const n=D.items.length, k=Object.keys(S.answers).length;
  const lab=S.phase==="item"?`第 ${S.idx+1}／${n} 題`:`已完成 ${k}／${n} 題`;
  return `<div class="pgw"><div class="prog"><i style="width:${Math.round(k/n*100)}%"></i></div><span>${lab}</span></div>` }
function renderIntro(){
  $app.innerHTML=`${progress()}<div class="card"><div class="act">開場</div>${pic(D.intro_img)}<p class="stem">${esc(D.intro)}</p></div>`;
  foot([btn("開始第一幕","primary",()=>{S.phase="actTitle";S.act="A";save();route()})]);
}
function renderActTitle(){
  const n=D.items.filter(x=>x.act===S.act).length;
  $app.innerHTML=`${progress()}<div class="card"><div class="act">共 ${n} 題</div><h2>${esc(D.acts[S.act])}</h2>
    ${now("選這一幕你有多確定，按開始")}
    <div class="adesc"><b>這一幕：${esc(D.act_desc[S.act].do)}</b><ul class="pts">${D.act_desc[S.act].pts.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>
    <div id="confbox"><div class="ask"><b>這一幕，你有多確定自己會？</b></div>
      <div class="row conf">${CONF.map(([k,l])=>`<button data-c="${k}">${l}</button>`).join("")}</div></div></div>`;
  const go=btn("開始","primary",()=>{S.phase="item";S.idx=D.items.findIndex(x=>x.act===S.act);save();route()},true);
  document.querySelectorAll("#confbox button").forEach(b=>b.onclick=()=>{
    S.actConf=S.actConf||{}; S.actConf[S.act]=b.dataset.c; save();
    document.querySelectorAll("#confbox button").forEach(x=>x.classList.toggle("sel",x===b)); go.disabled=false});
  foot([go]);
  window.scrollTo(0,0);
}
function next(){
  const cur=D.items[S.idx], nx=D.items[S.idx+1];
  if(!nx||nx.act!==cur.act){ S.phase="review"; S.act=cur.act }
  else { S.idx++ }
  save(); route();
}

let T;   // 本題暫存
function renderItem(){
  const it=D.items[S.idx]; T={conf:(S.actConf||{})[it.act]||""};
  const cq=D.conseq.filter(c=>c.target===it.id && S.answers[c.src] && !S.answers[c.src].correct);
  const banner=cq.map(c=>`<div class="banner"><b>⏩ 前面的選擇，現在出現後果</b>${esc(c.text)}</div>`).join("");
  $app.innerHTML=`${progress()}
  <div class="card">
    <div class="act">${esc(D.acts[it.act])}</div>
    <h2>${esc(it.title)}</h2>
    ${banner}
    ${pic(it.img)}
    ${it.anim==="angle"?`<div id="animbox">${angleAnim()}</div>`:""}
    <div id="nowbox"></div>
    ${it.type==="outcome"?"":`<p class="stem">${esc(it.stem)}</p>`}
    <div id="ans"></div>
    <div class="ref">依據：${esc(it.ref)}</div>
  </div>`;
  foot([]);
  ({mcq:ansMcq,multi:ansMulti,order:ansOrder,paint:ansPaint,outcome:ansOutcome})[it.type](it,document.getElementById("ans"));
  if(it.anim==="angle"){ const rp=()=>{const b=document.getElementById("animbox"); b.innerHTML=angleAnim(); document.getElementById("replay").onclick=rp}; document.getElementById("replay").onclick=rp; }
  window.scrollTo(0,0);

function setNow(t){ const b=document.getElementById("nowbox"); if(b) b.innerHTML=now(t) }
function record(it,chosen,correct,unknown,extra){
  S.answers[it.id]=Object.assign({conf:T.conf,chosen,correct:!!correct,unknown:!!unknown},extra||{}); save(); next();
}
/* Port-A 圓盤剖面＋角針入針動畫（90 度與 45 度並排；示意圖，非實際比例） */
function portSection(deg,uid){
  const W=300,H=250, cx=150;
  // 角針：直角彎針，針尖最後位置；90 度到底（y=176），45 度停在矽膠膜／側壁
  const tip = deg===90 ? {x:cx,y:176} : {x:178,y:128};
  const len = deg===90 ? 170 : 150, rad=(deg===90?90:45)*Math.PI/180;
  const sx = tip.x - Math.cos(rad)*len*(deg===90?0:1), sy = tip.y - Math.sin(rad)*len;
  const dx = (tip.x-sx), dy=(tip.y-sy);
  return `<svg viewBox="0 0 ${W} ${H}" class="psec" role="img" aria-label="Port-A 圓盤剖面，角針 ${deg} 度插入示意">
    <defs><linearGradient id="ti${uid}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#c9ced6"/><stop offset="1" stop-color="#8d96a3"/></linearGradient></defs>
    <rect x="0" y="0" width="${W}" height="${H}" fill="#fbfaf8"/>
    <path d="M0 52 Q150 34 300 52 L300 70 Q150 52 0 70Z" fill="#e9b89c"/>
    <path d="M0 70 Q150 52 300 70 L300 205 L0 205Z" fill="#f6e2b3"/>
    <rect x="0" y="205" width="${W}" height="45" fill="#df9d92"/>
    <path d="M86 186 L96 104 L204 104 L214 186 Z" fill="url(#ti${uid})" stroke="#6f7884" stroke-width="1.5"/>
    <rect x="104" y="98" width="92" height="30" rx="8" fill="#e8eef3" stroke="#9aa6b2"/>
    <rect x="116" y="130" width="68" height="48" rx="4" fill="#bfe0f2" stroke="#7aa9c4"/>
    <rect x="212" y="150" width="88" height="12" rx="6" fill="#d9e6ee" stroke="#9aa6b2"/>
    <rect x="116" y="176" width="68" height="4" fill="#5f6873"/>
    <text x="8" y="64" font-size="11" fill="#7a5a4a">皮膚</text><text x="8" y="100" font-size="11" fill="#8a7440">皮下組織</text>
    <text x="226" y="145" font-size="11" fill="#5b6b7a">導管</text>
    <text x="120" y="122" font-size="10" fill="#5b6b7a">矽膠膜</text><text x="124" y="160" font-size="10" fill="#3f6f8c">儲液槽</text>
    <g class="ndl" style="--dx:${(-dx*0.9).toFixed(1)}px;--dy:${(-dy*0.9).toFixed(1)}px">
      <line x1="${sx.toFixed(1)}" y1="${sy.toFixed(1)}" x2="${tip.x}" y2="${tip.y}" stroke="#4a5563" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="9" fill="#ffffff" stroke="#4a5563" stroke-width="2"/>
    </g>
    <text x="150" y="240" text-anchor="middle" font-size="15" font-weight="700" fill="#14171c">${deg} 度</text>
  </svg>`;
}
function angleAnim(){
  return `<div class="anim2">${portSection(90,"a")}${portSection(45,"b")}</div>
  <div class="row" style="justify-content:center;margin:-4px 0 10px"><button id="replay">▶ 再播一次</button></div>`;
}
function ansMcq(it,box){
  const opts=shuffle(it.opts.filter(o=>!o.unknown),it.id).concat(it.opts.filter(o=>o.unknown));
  if(it.imgopts) return ansImgMcq(it,box,opts);
  setNow("選一個");
  box.innerHTML=opts.map((o,i)=>`<button class="opt${o.unknown?" unk":""}" data-i="${i}">${esc(o.t)}</button>`).join("");
  box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const o=opts[+b.dataset.i]; record(it,o.unknown?"不知道":o.t,o.ok,o.unknown)});
}
/* 圖卡選項：兩欄圖卡，先選中再按「確認」；「不知道」維持文字按鈕 */
function ansImgMcq(it,box,opts){
  let sel=-1;
  const card=(o,i)=>{ const im=o.img&&D.images&&D.images[o.img];
    return `<button class="ic" data-i="${i}">${im?`<img src="images/${esc(im)}" alt="" draggable="false">`:`<div class="ph">${esc(o.ph||"🖼️")}</div>`}<span>${esc(o.t)}</span></button>` };
  setNow("選一張圖卡，按確認");
  box.innerHTML=`<div class="icards">`+opts.map((o,i)=>o.unknown?"":card(o,i)).join("")+`</div>`+
    opts.map((o,i)=>o.unknown?`<button class="opt unk" data-i="${i}">${esc(o.t)}</button>`:"").join("");
  const ok=btn("確認","primary",()=>{const o=opts[sel]; record(it,o.unknown?"不知道":o.t,o.ok,o.unknown)},true);
  box.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{ sel=+b.dataset.i;
    box.querySelectorAll("[data-i]").forEach(x=>x.classList.toggle("sel",+x.dataset.i===sel)); ok.disabled=false });
  foot([ok]);
}
function ansMulti(it,box){
  const opts=shuffle(it.opts.filter(o=>!o.unknown),it.id).concat(it.opts.filter(o=>o.unknown));
  const sel=new Set();
  setNow("可以選多個，選好按確認");
  box.innerHTML=opts.map((o,i)=>`<button class="opt${o.unknown?" unk":""}" data-i="${i}">${esc(o.t)}</button>`).join("");
  const ok=btn("確認","primary",()=>{
    const ch=[...sel].map(i=>opts[i]); const unk=ch.some(o=>o.unknown);
    const correct=!unk && opts.every((o,i)=>o.unknown || (o.ok===sel.has(i)));
    record(it,unk?"不知道":ch.map(o=>o.t).join("、"),correct,unk);
  },true);
  box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;
    if(opts[i].unknown){sel.clear();sel.add(i)} else {const u=opts.findIndex(o=>o.unknown);sel.delete(u); sel.has(i)?sel.delete(i):sel.add(i)}
    box.querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel",sel.has(+x.dataset.i))); ok.disabled=!sel.size});
  foot([ok]);
}
/* 排順序：左右兩欄。左＝打亂的步驟卡，右＝你的順序（插在放開的位置、自動編號）；
   只能拖曳：左→右放入、右邊上下拖調整、右→左或點 × 退回；右邊放滿才能確認 */
function ansOrder(it,box){
  const mix=shuffle(it.steps.map((_,i)=>i),it.id+"o"); let list=[];
  setNow("把左邊的步驟拖到右邊，排出順序");
  const draw=()=>{
    const pool=mix.filter(i=>!list.includes(i));
    box.innerHTML=`<div class="ocols">
      <div class="ocol" data-side="L"><div class="oh">步驟</div>${pool.map(i=>`<div class="stc" data-i="${i}">${esc(it.steps[i])}</div>`).join("")||`<div class="oe">都放到右邊了</div>`}</div>
      <div class="ocol R" data-side="R"><div class="oh">你的順序</div>${list.map((i,k)=>`<div class="stc in" data-i="${i}"><span class="n">${k+1}</span><span class="tx">${esc(it.steps[i])}</span><button class="x" data-x="${i}" aria-label="退回左邊">×</button></div>`).join("")}${list.length<it.steps.length?`<div class="dz">拖到這裡<br>（第 ${list.length+1} 步）</div>`:""}</div></div>`;
    box.querySelectorAll("[data-x]").forEach(b=>{ b.addEventListener("pointerdown",e=>e.stopPropagation()); b.onclick=()=>{ list=list.filter(v=>v!==+b.dataset.x); draw() } });
    box.querySelectorAll(".stc").forEach(c=>c.addEventListener("pointerdown",e=>{
      if(e.target.closest(".x")) return;
      e.preventDefault(); const i=+c.dataset.i, fromR=c.classList.contains("in"), r=c.getBoundingClientRect();
      let moved=false, ghost=null, lastY=e.clientY, raf=0, tgt=null;
      const L=box.querySelector('[data-side="L"]'), R=box.querySelector('[data-side="R"]'), ind=document.createElement("div"); ind.className="ins";
      const inside=(el,x,y)=>{const b=el.getBoundingClientRect();return x>b.left&&x<b.right&&y>b.top-20&&y<b.bottom+40};
      const hit=(x,y)=>{
        L.classList.remove("over"); R.classList.remove("over"); ind.remove(); tgt=null;
        if(inside(R,x,y)){ R.classList.add("over");
          const cards=[...R.querySelectorAll(".stc.in")].filter(el=>el!==c);
          let k=cards.findIndex(el=>{const b=el.getBoundingClientRect();return y<b.top+b.height/2}); if(k<0) k=cards.length;
          const dz=R.querySelector(".dz"); if(dz) dz.classList.toggle("on",k===cards.length);
          if(k<cards.length) R.insertBefore(ind,cards[k]); else if(dz) R.insertBefore(ind,dz); else R.appendChild(ind);
          tgt={side:"R",k} }
        else if(inside(L,x,y)){ L.classList.add("over"); tgt={side:"L"} } };
      const tick=()=>{ if(moved){ const h=innerHeight; if(lastY>h-120) scrollBy(0,14); else if(lastY<80) scrollBy(0,-14) } raf=requestAnimationFrame(tick) };   // 拖到畫面上下緣自動捲動
      raf=requestAnimationFrame(tick);
      const mv=ev=>{ lastY=ev.clientY;
        if(!moved&&Math.hypot(ev.clientX-e.clientX,ev.clientY-e.clientY)>8){ moved=true; c.classList.add("lift");
          ghost=c.cloneNode(true); ghost.classList.add("ghost"); ghost.classList.remove("lift"); ghost.style.width=r.width+"px"; document.body.appendChild(ghost) }
        if(ghost){ ghost.style.left=(ev.clientX-r.width/2)+"px"; ghost.style.top=(ev.clientY-20)+"px"; hit(ev.clientX,ev.clientY) } };
      const clean=()=>{ cancelAnimationFrame(raf); window.removeEventListener("pointermove",mv); window.removeEventListener("pointerup",up); window.removeEventListener("pointercancel",cancel); if(ghost) ghost.remove(); ind.remove(); c.classList.remove("lift"); L.classList.remove("over"); R.classList.remove("over") };
      const cancel=()=>{ clean() };
      const up=()=>{ const t=tgt; clean(); if(!moved||!t) return;
        if(t.side==="R"){ const rest=list.filter(v=>v!==i); rest.splice(t.k,0,i); list=rest }
        else if(fromR){ list=list.filter(v=>v!==i) }
        draw() };
      window.addEventListener("pointermove",mv); window.addEventListener("pointerup",up); window.addEventListener("pointercancel",cancel);
    }));
    foot([btn("不知道","",()=>record(it,"不知道",false,true)),btn("確認","primary",()=>{
      const correct=list.every((v,k)=>v===it.answer_order[k]); record(it,list.map(v=>v+1).join("→"),correct,false)},list.length!==it.steps.length)]);
  }; draw();
}

function ansOutcome(it,box){
  const all=shuffle(it.outs.map(o=>({...o,ok:true})).concat(it.douts.map(o=>({...o,ok:false}))),it.id+"o");
  const sel=new Set(); let own=""; const place={}; it.keys.forEach(k=>place[k.id]=new Set());
  const step1=()=>{
    setNow("（用物準備 1／3）勾出這一幕做完時會看到的樣子（可以多勾）");
    box.innerHTML=`
      <div class="ogrid">${all.map((o,i)=>outCard(o,sel.has(i),i)).join("")}</div>
      <label class="hint" for="own">還想到別的嗎？（選填）</label><textarea id="own" placeholder="例：病人知道角針要留置到什麼時候">${esc(own)}</textarea>`;
    box.querySelectorAll(".oc").forEach(b=>b.onclick=()=>{own=document.getElementById("own").value;const i=+b.dataset.i;sel.has(i)?sel.delete(i):sel.add(i);step1()});
    foot([btn("下一步：收斂","primary",()=>{own=document.getElementById("own").value;step2()},!sel.size)]); };
  const step2=()=>{
    const pk=new Set([...sel].map(i=>all[i].id));
    setNow(`（用物準備 2／3）對照 ${it.keys.length} 個關鍵成果，看你漏了什麼、勾錯什麼`);
    box.innerHTML=""+
      it.keys.map((k,n)=>`<div class="drop"><div class="dt">${n+1}. ${esc(k.t)}</div>${k.mem.map(mid=>{const o=it.outs.find(x=>x.id===mid);return `<div class="mi ${pk.has(mid)?"ok":"miss"}">${pk.has(mid)?"✓ 你有想到":"✗ 漏了"}：${esc(o.s)}</div>`}).join("")}</div>`).join("")+
      (it.douts.some(o=>pk.has(o.id))?`<div class="drop bad"><div class="dt">這些不是正確的完成樣子</div>${it.douts.filter(o=>pk.has(o.id)).map(o=>`<div class="mi miss">✗ ${esc(o.s)}（${esc(o.why)}）</div>`).join("")}</div>`:"")+
      (own.trim()?`<div class="hint">你自己寫的：${esc(own)}</div>`:"");
    foot([btn("回上一步","",step1),btn("下一步：放用物","primary",step3)]); window.scrollTo(0,0); };
  const shelf=shuffle([...new Set(it.keys.flatMap(k=>k.sup).concat(it.dsup.map(x=>x.s)))],it.id+"sh");
  /* 第三步：每個關鍵成果一頁、滿版；每頁都列出全部用物，拖進成果框後從圖卡區消失（點框內的 × 退回） */
  let picked=null, kp=0, fs=null;
  const closeFs=()=>{ if(fs){ fs.remove(); fs=null; window.removeEventListener("resize",fit); document.body.style.overflow="" } };
  const fit=()=>{   // 依可用空間算圖卡大小，讓全部圖卡一個畫面放得下
    if(!fs) return; const sh=fs.querySelector(".fsh"), W=sh.clientWidth, H=sh.clientHeight, N=shelf.length, G=6, L=38;
    let best=null;
    for(let c=2;c<=12;c++){ const cw=(W-G*(c-1))/c, rows=Math.ceil(N/c);
      const s=Math.min(cw-8,(H-G*(rows-1))/rows-8-L,200); if(s<36) continue;
      if(!best||s>best.s) best={c,s} }
    if(!best) best={c:4,s:Math.max(36,(W-G*3)/4-8)};
    sh.style.setProperty("--s",Math.floor(best.s)+"px"); sh.style.gridTemplateColumns=`repeat(${best.c},${Math.floor(best.s)+8}px)` };
  const step3=()=>{
    const k=it.keys[kp], got=place[k.id];
    if(!fs){ fs=document.createElement("div"); fs.className="fs"; document.body.appendChild(fs); document.body.style.overflow="hidden"; window.addEventListener("resize",fit) }
    foot([]);
    fs.innerHTML=`<div class="fhd"><div class="act">${esc(D.acts[it.act])}｜用物準備 第三步</div>
        <div class="fkn">關鍵成果 ${kp+1}／${it.keys.length}</div><h2>${esc(k.t)}</h2>
        ${now("（用物準備 3／3）把需要的用物拖進框裡")}</div>
      <div class="fbx${picked?" pk":""}" data-k="${k.id}">${[...got].map(sid=>`<span class="chip">${esc(D.catalog[sid])}<button data-rm="${sid}" aria-label="退回">×</button></span>`).join("")||`<span class="hint">${picked?"點這裡放入":"拖用物到這裡"}</span>`}</div>
      <div class="fsh">${shelf.filter(sid=>!got.has(sid)).map(sid=>{const im=D.images&&D.images["sup/"+sid];
        return `<div class="fc" data-s="${sid}"${picked===sid?" data-pk=\"1\"":""}>${im?`<img src="images/${esc(im)}" alt="" draggable="false">`:`<div class="ph">🧰</div>`}<span>${esc(D.catalog[sid])}</span></div>`}).join("")}</div>
      <div class="fft"></div>`;
    const bx=fs.querySelector(".fbx");
    fs.querySelectorAll("[data-rm]").forEach(b=>b.onclick=e=>{e.stopPropagation();got.delete(b.dataset.rm);step3()});
    bx.onclick=()=>{ if(picked){ got.add(picked); picked=null; step3() } };
    fs.querySelectorAll(".fsh .fc").forEach(c=>c.addEventListener("pointerdown",e=>{
      e.preventDefault(); const sid=c.dataset.s, r=c.getBoundingClientRect(); let moved=false, ghost=null;
      const over=(x,y)=>{const b=bx.getBoundingClientRect();const o=x>b.left&&x<b.right&&y>b.top&&y<b.bottom;bx.classList.toggle("over",o);return o};
      const mv=ev=>{ if(!moved&&Math.hypot(ev.clientX-e.clientX,ev.clientY-e.clientY)>8){ moved=true;
          ghost=c.cloneNode(true); ghost.className="fc ghost"; ghost.removeAttribute("data-pk"); ghost.style.width=r.width+"px"; ghost.style.setProperty("--s",getComputedStyle(c).getPropertyValue("--s")); document.body.appendChild(ghost) }
        if(ghost){ ghost.style.left=(ev.clientX-r.width/2)+"px"; ghost.style.top=(ev.clientY-r.height/2)+"px"; over(ev.clientX,ev.clientY) } };
      const clean=()=>{ window.removeEventListener("pointermove",mv); window.removeEventListener("pointerup",up); window.removeEventListener("pointercancel",clean); if(ghost) ghost.remove(); bx.classList.remove("over") };
      const up=ev=>{ const hit=moved&&over(ev.clientX,ev.clientY); clean();
        if(hit){ got.add(sid); picked=null; step3() } else if(!moved){ picked=picked===sid?null:sid; step3() } };
      window.addEventListener("pointermove",mv); window.addEventListener("pointerup",up); window.addEventListener("pointercancel",clean);
    }));
    const last=kp===it.keys.length-1, ft=fs.querySelector(".fft");
    ft.appendChild(btn(kp?"上一個成果":"回上一步","",()=>{picked=null; if(kp){kp--;step3()} else {closeFs();step2()}}));
    ft.appendChild(last?confirmBtn():btn("下一個成果","primary",()=>{picked=null;kp++;step3()}));
    fit(); };
  const confirmBtn=()=>btn("確認","primary",()=>{ closeFs();
      const pk=new Set([...sel].map(i=>all[i].id));
      const missedO=it.outs.filter(o=>!pk.has(o.id)).map(o=>o.s), extraO=it.douts.filter(o=>pk.has(o.id)).map(o=>o.s);
      const supErr=[]; it.keys.forEach(k=>{ const got=[...place[k.id]]; const miss=k.sup.filter(x=>!got.includes(x)), wrong=got.filter(x=>!k.sup.includes(x));
        if(miss.length||wrong.length) supErr.push({t:k.t,miss:miss.map(x=>D.catalog[x]),wrong:wrong.map(x=>D.catalog[x])}) });
      const correct=!missedO.length&&!extraO.length&&!supErr.length;
      record(it,`成果漏 ${missedO.length}、多 ${extraO.length}；用物有誤 ${supErr.length} 項`,correct,false,{missedO,extraO,supErr,own});
    });
  step1();
}
function ansPaint(it,box){
  setNow("從中間的點開始，由內往外塗");
  box.innerHTML=`<canvas id="cv" width="600" height="600"></canvas><div class="hint" id="ph"></div>`;
  const cv=document.getElementById("cv"), g=cv.getContext("2d"), W=600, C={x:300,y:290}, R={x:170,y:160,w:260,h:260};
  const G=30, cell=W/G, painted=new Set(); let first=null, down=false, tries=(S._paintTries||0);
  const base=()=>{ g.fillStyle="#f3d9c6";g.fillRect(0,0,W,W);
    g.strokeStyle="#d9b8a3";g.lineWidth=6;g.beginPath();g.moveTo(40,90);g.quadraticCurveTo(300,40,560,90);g.stroke();   // 鎖骨示意
    // Port-A 皮下隆起：外圈陰影＋中央亮面＋右下暗面，做出摸得到的突起感
    const sh=g.createRadialGradient(C.x+10,C.y+12,40,C.x+6,C.y+8,78); sh.addColorStop(0,"rgba(150,95,70,.35)"); sh.addColorStop(1,"rgba(150,95,70,0)");
    g.fillStyle=sh; g.beginPath(); g.arc(C.x+6,C.y+8,78,0,7); g.fill();
    const bump=g.createRadialGradient(C.x-18,C.y-20,6,C.x,C.y,58); bump.addColorStop(0,"#fbe7d9"); bump.addColorStop(.55,"#f0cdb6"); bump.addColorStop(.85,"#dcae93"); bump.addColorStop(1,"#cf9f85");
    g.fillStyle=bump; g.beginPath(); g.arc(C.x,C.y,58,0,7); g.fill();
    g.strokeStyle="rgba(170,115,90,.45)"; g.lineWidth=2; g.beginPath(); g.arc(C.x,C.y,40,0,7); g.stroke();   // 圓盤邊緣隱約輪廓
    g.strokeStyle="rgba(170,110,90,.55)"; g.lineWidth=3; g.beginPath(); g.moveTo(C.x+70,C.y-58); g.quadraticCurveTo(C.x+92,C.y-30,C.x+104,C.y+6); g.stroke();   // 皮下導管走向
    g.strokeStyle="rgba(140,90,75,.5)"; g.lineWidth=2; g.beginPath(); g.moveTo(C.x-30,C.y-80); g.lineTo(C.x+30,C.y-84); g.stroke();   // 置入時的手術疤痕
    g.setLineDash([12,8]);g.strokeStyle="#5b6b86";g.lineWidth=3;g.strokeRect(R.x,R.y,R.w,R.h);g.setLineDash([]);   // 敷料範圍
    g.fillStyle="#5b6b86";g.font="22px sans-serif";g.fillText("敷料範圍",R.x+6,R.y-10);
    g.fillStyle="#c0392b";g.beginPath();g.arc(C.x,C.y,8,0,7);g.fill(); };
  base();
  const pos=e=>{const r=cv.getBoundingClientRect();const p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)*W/r.width,y:(p.clientY-r.top)*W/r.height}};
  const paint=p=>{g.fillStyle="rgba(120,180,240,.45)";g.beginPath();g.arc(p.x,p.y,26,0,7);g.fill();
    for(let i=Math.floor((p.x-26)/cell);i<=Math.floor((p.x+26)/cell);i++)for(let j=Math.floor((p.y-26)/cell);j<=Math.floor((p.y+26)/cell);j++){const cx=(i+.5)*cell,cy=(j+.5)*cell;if((cx-p.x)**2+(cy-p.y)**2<=26*26)painted.add(i+","+j)}};
  const st=e=>{e.preventDefault();down=true;const p=pos(e);if(!first)first=p;paint(p)}, mv=e=>{if(!down)return;e.preventDefault();paint(pos(e))}, en=()=>down=false;
  cv.addEventListener("pointerdown",st);cv.addEventListener("pointermove",mv);window.addEventListener("pointerup",en);
  const judge=()=>{ let tot=0,hit=0;
    for(let i=0;i<G;i++)for(let j=0;j<G;j++){const cx=(i+.5)*cell,cy=(j+.5)*cell;if(cx>R.x&&cx<R.x+R.w&&cy>R.y&&cy<R.y+R.h){tot++;if(painted.has(i+","+j))hit++}}
    let out=0; painted.forEach(k=>{const[i,j]=k.split(",").map(Number);const cx=(i+.5)*cell,cy=(j+.5)*cell;if(cx<R.x||cx>R.x+R.w||cy<R.y||cy>R.y+R.h)out++});
    const cov=hit/tot, center=first&&Math.hypot(first.x-C.x,first.y-C.y)<60, beyond=out>12;
    return {cov,center,beyond,pass:center&&cov>=.9&&beyond}; };
  foot([btn("重塗","",()=>{painted.clear();first=null;base()}),btn("完成","primary",()=>{
    const j=judge(); tries++; S._paintTries=tries;
    if(j.pass){ delete S._paintTries; record(it,`通過（第 ${tries} 次）`,tries===1,false,{tries}); return }
    const msg=!j.center?"要從入針處（中間的點）開始，環狀由內向外。":(j.cov<.9?`敷料範圍內還有空白（目前約 ${Math.round(j.cov*100)}%）。`:"塗抹範圍要「大於」敷料範圍，往外再多塗一圈。");
    document.getElementById("ph").innerHTML=`<b>再試一次：</b>${msg}`; painted.clear();first=null;base();
  })]);
}

/* ---------- 段落結果 ---------- */
function renderReview(){
  const act=S.act, its=D.items.filter(x=>x.act===act);
  const pending=D.items.filter(x=>deferredTo(x.id)===act && S.answers[x.id]);   // 前面幕待揭曉、本幕揭曉
  const line=(it,a)=>{ const ok=a.correct;
    if(it.type==="outcome"){ const why=Object.fromEntries(it.douts.map(o=>[o.s,o.why]));
      return `<div class="rv"><div class="h"><span class="tag ${ok?"ok":"bad"}">${ok?"全對":"要補"}</span><b>${esc(it.title)}</b></div>`+
        `<p>關鍵成果：${it.keys.map((k,n)=>`${n+1}. ${esc(k.t)}（用物：${esc(k.sup.map(x=>D.catalog[x]).join("、"))}）`).join("；")}</p>`+
        ((a.missedO||[]).length?`<p><b>沒想到的成果：</b>${esc(a.missedO.join("、"))}</p>`:"")+
        ((a.extraO||[]).length?`<p><b>不是正確的完成樣子：</b>${a.extraO.map(t=>`${esc(t)}（${esc(why[t])}）`).join("；")}</p>`:"")+
        (a.supErr||[]).map(e=>`<p><b>${esc(e.t)}</b>：${e.miss.length?`漏拿 ${esc(e.miss.join("、"))}`:""}${e.miss.length&&e.wrong.length?"；":""}${e.wrong.length?`不需要 ${esc(e.wrong.join("、"))}`:""}</p>`).join("")+
        (it.dsup.length?`<p class="hint">不需要的用物：${it.dsup.map(x=>`${esc(D.catalog[x.s])}（${esc(x.why)}）`).join("；")}</p>`:"")+`</div>` } const right=it.type==="order"?it.answer_order.map(i=>it.steps[i]).join(" → "):it.type==="paint"?"從入針處環狀由內向外，範圍大於敷料":it.opts.filter(o=>o.ok).map(o=>o.t).join("、");
    return `<div class="rv"><div class="h"><span class="tag ${ok?"ok":"bad"}">${ok?"答對":(a.unknown?"不知道":"答錯")}</span><b>${esc(it.title)}</b></div>
      ${ok?"":`<p>你的答案：${esc(a.chosen)}</p><p>正確：${esc(right)}</p>`}${it.explain?`<p>${esc(it.explain)}</p>`:""}${it.explain_img&&D.images&&D.images[it.explain_img]?pic(it.explain_img):""}</div>`};
  let html=`${progress()}<div class="card"><div class="act">段落結果</div><h2>${esc(D.acts[act])}</h2>${now("看哪幾題要補，再進下一幕")}`;
  its.forEach(it=>{const a=S.answers[it.id]; if(!a) return;
    if(deferredTo(it.id)) html+=`<div class="rv"><div class="h"><span class="tag wait">⏳ 之後揭曉</span><b>${esc(it.title)}</b></div><p>這一題的結果，會在後面的情境裡看到。</p></div>`;
    else html+=line(it,a)});
  if(pending.length){ html+=`<div class="grp">前面待揭曉的題目</div>`; pending.forEach(it=>html+=line(it,S.answers[it.id])) }
  const n=its.filter(it=>S.answers[it.id]&&S.answers[it.id].correct&&!deferredTo(it.id)).length;
  html+=`</div>`; $app.innerHTML=html;
  const nextAct={A:"B",B:"C"}[act];
  foot([btn(nextAct?`進入${D.acts[nextAct].split("｜")[0]}`:"看我的差距地圖","primary",()=>{ if(nextAct){S.act=nextAct;S.phase="actTitle"} else S.phase="final"; save(); route() })]);
  window.scrollTo(0,0);
}

/* ---------- 差距地圖＋寫出差距 ---------- */
function renderFinal(){
  const cnt={known:0,over:0,unsure:0,gap:0}; D.items.forEach(it=>{const c=gapClass(S.answers[it.id]); if(c) cnt[c]++});
  const map=act=>`<div class="grp">${esc(D.acts[act])}</div><div class="map">`+D.items.filter(x=>x.act===act).map(it=>{const c=gapClass(S.answers[it.id]);const g=GAPCLS[c]||{c:"var(--g-na)",i:"·",l:"未答"};return `<div class="cell" style="background:${g.c}" title="${esc(it.title)}｜${g.l}">${it.id}<small>${g.i} ${g.l}</small></div>`}).join("")+`</div>`;
  const total=D.items.filter(it=>S.answers[it.id]&&S.answers[it.id].correct).length;
  $app.innerHTML=`${progress()}
  <div class="card"><div class="act">我的差距地圖</div>${now("寫下你的差距，按送出")}
    <div class="big">${total} / ${D.items.length} 題答對</div>
    <div class="leg">${Object.entries(GAPCLS).map(([k,g])=>`<span><i style="background:${g.c}"></i>${g.i} ${g.l}（${cnt[k]}）</span>`).join("")}</div>
    <p class="hint"><b>橘色「以為會」最要注意</b>：你在那一幕開始前選「很確定」、卻答錯的題目。</p>
    ${map("A")}${map("B")}${map("C")}
  </div>
  <div class="card"><h2>用你自己的話寫下差距</h2>
    <label for="g1"><b>1. 哪一步你原本以為會、結果不會？</b>（必填）</label>
    <textarea id="g1" placeholder="例：我以為回血有出來就可以給，原來要確認是全血。"></textarea>
    <label for="g2" style="display:block;margin-top:10px"><b>2. 你打算怎麼補？</b></label>
    <textarea id="g2" placeholder="例：等一下實作請老師示範回抽；回去重看數位課程的人工血管照護。"></textarea>
    <div style="margin-top:10px"><b>3. 等一下實作，你想請老師帶哪些步驟？</b>（可複選）</div>
    ${["A","B","C"].map(act=>`<div class="grp">${esc(D.acts[act])}</div>`+D.items.filter(x=>x.act===act).map(it=>`<label class="ck"><input type="checkbox" value="${it.id}"${gapClass(S.answers[it.id])==="over"||gapClass(S.answers[it.id])==="gap"?"":""}> ${esc(it.id)}　${esc(it.title)}</label>`).join("")).join("")}
    <div id="st"></div>
  </div>`;
  const g1=document.getElementById("g1"); const send=btn("送出","primary",submit,true);
  g1.addEventListener("input",()=>send.disabled=!g1.value.trim()); foot([send]); window.scrollTo(0,0);
}
async function submit(){
  const st=document.getElementById("st"), setS=(c,m)=>st.innerHTML=`<div class="status ${c}">${m}</div>`;
  const ans=D.items.map(it=>{const a=S.answers[it.id]||{};return{id:it.id,conf:a.conf||"",chosen:a.chosen||"",correct:!!a.correct,unknown:!!a.unknown,cls:gapClass(a)||""}});
  const now=new Date();
  const payload={code:S.code,started_at:S.started_at,submitted_at:now.toISOString(),duration_sec:Math.round((now-new Date(S.started_at))/1000),
    total:ans.filter(a=>a.correct).length,max:ans.length,unknown:ans.filter(a=>a.unknown).length,answers:ans,
    hc_wrong:ans.filter(a=>a.cls==="over").map(a=>a.id),ask_steps:[...document.querySelectorAll("input[type=checkbox]:checked")].map(x=>x.value),
    gap1:document.getElementById("g1").value.trim(),gap2:document.getElementById("g2").value.trim(),
    act_conf:S.actConf||{},submission_id:S.sid||(S.sid=S.code+"-"+Date.now().toString(36)),version:VERSION,ua:navigator.userAgent};
  S.payload=payload; save();
  if(!ENDPOINT){ setS("warn","（測試版）尚未設定回傳網址，作答只留在本頁。"); S.sent=true; S.phase="done"; save(); setTimeout(route,1200); return }
  setS("warn","送出中…");
  try{
    const r=await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload),redirect:"follow"});
    const j=await r.json().catch(()=>null);
    if(j&&j.ok){ S.sent=true; S.phase="done"; save(); route(); return }
    throw new Error(j&&j.error||"no response");
  }catch(e){
    try{ await fetch(ENDPOINT,{method:"POST",mode:"no-cors",body:JSON.stringify(payload)}); S.sent=true; S.phase="done"; save(); route() }
    catch(e2){ setS("bad","送出失敗，請檢查網路後再按一次「送出」。") }
  }
}
function renderDone(){
  $app.innerHTML=`<div class="card"><h2>已送出，謝謝你</h2><p>老師正在看全班的差距地圖，等一下的實作會先帶大家最需要的步驟。</p><p class="hint">你寫的差距：${esc(S.payload&&S.payload.gap1)}</p></div>`;
  foot([btn("再做一次","",()=>{try{localStorage.removeItem("onboard_state")}catch(e){} newState(); renderStart()})]);
}
