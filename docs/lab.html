body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}

/* 10/26 使用者：手機看不到填答互動畫面——手機上滑動時容易誤拖分隔條，操作區被縮成一小格內捲、填答區藏在格子外面；
   選過「左右並排」也會擠成窄條。手機（窄螢幕）一律上下自然排列、不內捲，版面按鈕與分隔條不顯示 */

<body>
<div class="top"><div class="in"><button id="backlab" hidden>← 技術站清單</button><b id="pnum"></b></div></div>
<div class="wrap" id="app"></div>
<div id="toast"></div>
<script>
const $ = s => document.querySelector(s);
function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("on"), 2400); }
let AC; function beep(ok, f){ try{ AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = f || (ok ? 880 : 220); g.gain.value = .06; o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + (ok ? .12 : .25)); }catch(e){} }
function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function confetti(){ const C = ["#0f7c86", "#f5a524", "#1f9d55", "#e84393", "#2f80ed"]; for(let i = 0; i < 40; i++){ const d = document.createElement("i"); d.className = "cf"; d.style.left = Math.random() * 100 + "vw"; d.style.background = C[i % 5]; d.style.animationDelay = Math.random() * .5 + "s"; document.body.appendChild(d); setTimeout(() => d.remove(), 2400); } }
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const say = (t, ok) => `<div class="${ok ? "ex" : "warn"}">${t}</div>`;
const KEY = "chemo-lab-v1";
let DONE = {}; try{ DONE = JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ DONE = {}; }
function labDone(id){ if(!DONE[id]){ DONE[id] = Date.now(); try{ localStorage.setItem(KEY, JSON.stringify(DONE)); }catch(e){} } }
/* 每一站：LABS.push({id, icon, title, items:[評核表項次], desc, steps:[…]})，由 engine.js 的 runStation 執行 */
const LABS = [];
/* ═══ 動手做實驗引擎（七上生物站 sims3.js、八上自然 lab.html 共用；build 時內嵌） ═══
   提供：handDnd 拖曳／點選放置、handAccident 出事＋急救關卡、handCtl 暫停／上一步／全部重來、flameP 火焰
   頁面需先提供：toast(msg)、beep(ok)、shuffle(arr)、confetti() */
/* 共用：拖曳或「先點器材、再點目的地」；cb.drop(id, x, y) 用 SVG 座標；cb.tap(id) 回傳 true 表示已當成動作處理 */
function handDnd(svg, cb){
  let sel = null;
  const pt = e => { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
  const mark = () => svg.querySelectorAll("[data-it]").forEach(x => x.classList.toggle("sel", x.dataset.it === sel));
  svg.addEventListener("pointerdown", e => {
    const g = e.target.closest("[data-it]");
    if(!g){ if(sel){ const id = sel, p = pt(e); sel = null; cb.drop(id, p.x, p.y); } return; }
    e.preventDefault();
    const p0 = pt(e), base = g.getAttribute("transform") || ""; let moved = false;
    svg.setPointerCapture(e.pointerId);
    g.parentNode.appendChild(g);
    const mv = ev => { const p = pt(ev), dx = p.x - p0.x, dy = p.y - p0.y; if(Math.hypot(dx, dy) > 5) moved = true; if(moved) g.setAttribute("transform", `translate(${dx} ${dy}) ${base}`); };
    const up = ev => {
      svg.removeEventListener("pointermove", mv); svg.removeEventListener("pointerup", up); svg.removeEventListener("pointercancel", up);
      const id = g.dataset.it;
      if(moved){ sel = null; g.setAttribute("transform", base); const p = pt(ev); cb.drop(id, p.x, p.y); return; }
      if(sel && sel !== id){ const s0 = sel, p = pt(ev); sel = null; cb.drop(s0, p.x, p.y); return; }
      if(cb.tap && cb.tap(id) === true){ sel = null; return; }
      sel = sel === id ? null : id; mark();
      if(sel && cb.name) toast(`已拿起「${cb.name(sel)}」，再點要放的位置`);
    };
    svg.addEventListener("pointermove", mv); svg.addEventListener("pointerup", up); svg.addEventListener("pointercancel", up);
  });
}
/* 按鈕列：內容變了才重建，點擊用事件委派。
   畫面每秒重畫好幾次（倒液體、冒氣泡）時，按到一半的按鈕才不會被換掉而點不到 */
function handBtns(box, html, act){
  if(box._h !== html){ box._h = html; box.innerHTML = html; }
  box.onclick = e => { const b = e.target.closest("[data-b]"); if(b && !b.disabled) act(b.dataset.b); };
}
const inR = (x, y, r) => x >= r[0] && x <= r[2] && y >= r[1] && y <= r[3];

/* 火焰：(x, y) 是火焰底部中心 */
function flameP(x, y, h, w, c1, c2, d){
  const P = (H, W) => `M${x} ${y} C${x - W} ${y - H * .4} ${x - W * .25} ${y - H * .75} ${x} ${y - H} C${x + W * .25} ${y - H * .75} ${x + W} ${y - H * .4} ${x} ${y} Z`;
  return `<g class="flame" style="animation-delay:${d || 0}s"><path d="${P(h, w)}" fill="${c1}"/><path d="${P(h * .55, w * .5)}" fill="${c2}"/></g>`;
}
const FIRE_SVG = `<svg viewBox="0 0 240 110"><rect x="0" y="92" width="240" height="18" rx="4" fill="#6b4a2f"/>
  ${flameP(40, 94, 48, 20, "#ff6a1f", "#ffd23f", .1)}${flameP(80, 94, 78, 28, "#ff4d1f", "#ffcf3a", 0)}${flameP(122, 94, 96, 32, "#ff5a1f", "#ffe066", .15)}
  ${flameP(165, 94, 70, 26, "#ff4d1f", "#ffcf3a", .05)}${flameP(205, 94, 44, 18, "#ff6a1f", "#ffd23f", .2)}</svg>`;
const BREAK_SVG = `<svg viewBox="0 0 240 110"><rect x="0" y="92" width="240" height="18" rx="4" fill="#6b4a2f"/>
  <ellipse cx="120" cy="92" rx="95" ry="7" fill="#8ecdf0" opacity=".8"/>
  <path d="M85 92 l10 -40 l14 8 l-6 32 z M125 92 l4 -34 l16 6 l-4 28z M150 90 l18 -18 l8 10 l-12 10z M70 90 l-14 -10 l6 -6 l14 12z" fill="#dfe8ef" stroke="#fff" stroke-width="2" opacity=".9"/>
  <g stroke="#fff" stroke-width="2" opacity=".7"><path d="M60 40 q6 -10 0 -20"/><path d="M120 34 q6 -10 0 -20"/><path d="M180 40 q6 -10 0 -20"/></g></svg>`;

/* 出事畫面＋急救關卡：答對急救題才能回去重做 */
function handAccident(card, cfg, onBack){
  const el = document.createElement("div"); el.className = "acc";
  const opts = shuffle(cfg.opts);
  el.innerHTML = `<div class="accpic">${cfg.pic || FIRE_SVG}</div>
    <h2>${cfg.title}</h2><p style="margin:0">${cfg.cause}</p>

/* 共用控制列：暫停／上一步／全部重來；o = {canUndo, undo, reset}
   ctl.wait(ms, fn)：暫停時不倒數；按上一步或重來後，還沒到時間的動作一律作廢 */
function handCtl(card, o){
  const ctl = {paused: false, gen: 0};
  const bar = document.createElement("div"); bar.className = "hctl";
  bar.innerHTML = `<button class="btn ghost" data-c="pause">⏸ 暫停</button><button class="btn ghost" data-c="undo">↩ 上一步</button><button class="btn ghost" data-c="reset">🔁 全部重來</button>`;
  card.insertBefore(bar, card.querySelector(".htask"));
  const pz = document.createElement("div"); pz.className = "hpause";
  pz.innerHTML = `<div>⏸ 已暫停<br><small>按上方「▶ 繼續」回到實驗</small></div>`;
  const pb = bar.querySelector("[data-c=pause]");
  const setPause = v => { ctl.paused = v; card.classList.toggle("paused", v); pb.textContent = v ? "▶ 繼續" : "⏸ 暫停"; if(v) card.appendChild(pz); else pz.remove(); };
  bar.onclick = e => {
    const b = e.target.closest("[data-c]"); if(!b) return;
    if(b.dataset.c === "pause") return setPause(!ctl.paused);
    setPause(false); ctl.gen++;
    const acc = card.querySelector(".acc"); if(acc) acc.remove();
    b.dataset.c === "undo" ? o.undo() : o.reset();
  };
  ctl.wait = (ms, fn) => { const g = ctl.gen; let left = ms; const t = setInterval(() => { if(g !== ctl.gen){ clearInterval(t); return; } if(ctl.paused) return; left -= 100; if(left <= 0){ clearInterval(t); fn(); } }, 100); };
  ctl.upd = () => { bar.querySelector("[data-c=undo]").disabled = !o.canUndo(); };
  return ctl;
}


/* ═══ 技術站引擎：每一站＝一串步驟（steps），依序執行 ═══
   步驟共用欄位：type、task（上方任務列）、bg（情境圖，3:2）、item（這一步做完，評核表第幾項打勾；分好幾步的項目只寫在最後一步）、
                 okMsg（做對後的說明）、note（教學補充，畫面另標）
   type：
     mode   選情境（連線／非連線幫浦）：opts [{id, t}]
     drag   拖用物到位置：tray [用物 id]、zones [{id, r:[x1,y1,x2,y2], label}]、goal [[用物, 位置]]（或 S => 陣列）、
            ordered（要照 goal 順序）、tool（用物是工具，放完回到上排，例如條碼機）、judge(S, it, z) 回傳 null／錯誤訊息／{acc}
            btns [{t, acc}]：畫面下方的「偷吃步」按鈕，按了就出事
     taps   依序點畫面上的點：spots [{id, x, y, label, need}]（need＝點過哪個點才出現）、order [id]、tapImg {點: 換的圖}
     hold   按住不放：label、ms、after（完成後換的圖）
     rhythm 推-停-推-停：n（推幾次）、ml（每次幾 mL）、total（注射器總量，預設 n×ml）、beat [{bpm, t}]＋beatRef（節拍聲選項與文獻）
     choice 單選：q、opts [{t, ok, why, acc, pic}]
     seq    依序按按鈕：opts [{id, t}]、orders [[id…]]（任一條順序都可以）、why {id: 訊息或 {acc}}
     pump   幫浦設定 Rate → VTBI：order {rate, vtbi}；skipIf(S) 為真時直接「不適用」（silent：直接跳過、不顯示這一步）
     dose   推藥到剩多少：start（起始 mL）、by（每推幾 mL）、keep [最少, 最多]（停在這個範圍才對）、zero（推光了＝錯誤訊息或 {acc}）
   okScene：做對以後畫面換成這段 SVG（例如動畫）
   overlay(S)：drag／taps 畫面上再疊一層 SVG（例如管夾放大圓圈），隨狀態改變
   popup {title, svg, steps [文字], at [第幾秒亮]}：這一步做對後跳出說明視窗（動畫＋逐步文字），可再播一次
   media {title, items [{src, cap}], note}：這一步下方放說明影片（只在換步驟時重畫，按按鈕不會讓影片重播）
     manip  手動操作示意圖（推入、銜接、戳入）：start {零件: {x, y}}、render(S) 回傳 SVG（零件加 data-part）、
            move(S, 零件, x, y) 限制移動範圍、drop(S, 零件) 放手時判斷：true＝完成／字串＝提醒／{acc}＝出事／null＝沒事
   drag 可用 scene（自畫的 SVG 背景，取代 bg 照片；可以是 S => 字串）、fillPlace（放好的用物畫滿虛線框）、noCard（放好後不畫用物卡，由 scene 畫）
   choice 的選項可帶 svg（自畫的小圖，viewBox 0 0 120 120）；manip／choice 可用 vb 改畫面範圍（放大局部）、choice 可用 scene 取代 bg
   錯誤訊息若是 {acc: {title, cause, q, opts, lesson, pic}} 就出事（handAccident），答對處理題才回到出事前 */

/* 說明視窗：點背景或「知道了」關閉；「再播一次」重新放動畫（重建內容讓 CSS 動畫重跑） */

function runStation(pane, L){
  const ST = L.steps;
  let S, accN = 0, holdT = null, mediaFor = -1;
  const fresh = (si, keep) => ({si, ok: false, fb: "", placed: {}, hit: [], taps: [], seq: [], bad: [], n: 0, last: "", hp: 0, pf: {rate: null, vtbi: null}, psel: "", pos: null, mode: keep ? keep.mode : null, fin: false});
  S = fresh(0);
  pane.innerHTML = `<div class="card sim hand">
    <p class="muted" style="margin:0">${L.intro || "把上排用物<b>拖到畫面上的虛線框</b>（或先點用物、再點虛線框）。放錯了可以把用物拖回上排。"}</p>
    <div class="htask" id="task"></div>
    <div class="simview" id="view"></div>
    <div id="ctrls"></div>
    <div id="fb"></div><div id="media"></div></div>
    <div class="card"><h3 style="margin-top:0">📋 本站評核表</h3><div id="chk"></div></div>`;
  const card = pane.querySelector(".hand");
  const hist = [], cur = () => JSON.stringify(S);
  const commit = fn => { hist.push(cur()); fn(); ctl.upd(); };
  const ctl = handCtl(card, {
    canUndo: () => hist.length > 0,
    undo(){ stopHold(); const o = hist.pop(); if(o){ S = JSON.parse(o); S.fb = say("↩ 回到上一步。", true); draw(); } ctl.upd(); },
    reset(){ stopHold(); hist.length = 0; accN = 0; S = fresh(0); S.fb = say("🔁 全部重來。", true); draw(); ctl.upd(); }});
  const st = () => ST[S.si];
  const goals = s => typeof s.goal === "function" ? s.goal(S) : (s.goal || []);
  const doneItems = () => new Set(ST.slice(0, S.si + (S.ok ? 1 : 0)).flatMap(s => s.item ? [].concat(s.item) : []));
  const curItem = () => { for(let i = S.si; i < ST.length; i++) if(ST[i].item) return [].concat(ST[i].item)[0]; return 0; };

  /* 做錯：一般訊息只提醒；{acc} 會出事 */
  function bad(w){
    if(w && w.acc){ accN++; handAccident(card, Object.assign({pic: EMO("⚠️")}, w.acc), () => { S.fb = say("回到出事前，再做一次。", true); draw(); }); return; }
    beep(false); S.fb = say("⚠️ " + (w || "這樣不對，再想想看。")); draw();
  }
  function finish(){
    S.ok = true; beep(true);
    const s = st();
    if(s.popup) setTimeout(() => showPop(s.popup), 120);
    S.fb = say("✅ " + (s.okMsg || "做對了！") + (s.item ? CHK_NO([].concat(s.item).join("、")) : ""), true) + (s.note ? `<div class="note">📝 教學補充：${s.note}</div>` : "");
  }
  function next(){
    commit(() => {
      if(S.si + 1 >= ST.length){ S.fin = true; return; }
      S = fresh(S.si + 1, S);
      while(st().silent && st().skipIf(S)){ if(S.si + 1 >= ST.length){ S.fin = true; return; } S = fresh(S.si + 1, S); }
      const s = st();
      if(s.skipIf && s.skipIf(S)){ S.ok = true; S.fb = say("➖ " + s.skipMsg, true); }
    });
    window.scrollTo({top: pane.getBoundingClientRect().top + scrollY - 70, behavior: "smooth"});
    draw();
  }

  /* ── 畫面 ── */
  const trayRows = s => s.tray ? Math.ceil(s.tray.length / 5) : 0;
  function itemG(id, x, y, w, small){
    const it = ITEMS[id], c = it.crop || [0, 0, 1, 1], lines = it.name.split("\n");
    /* 名稱要在卡片框內：卡片比圖寬一點，字太長就縮小字體（中文字約 1 字寬、英數約 0.56 字寬） */
    const pad = small ? 2 : 6, tw = t => [...t].reduce((n, ch) => n + (ch.charCodeAt(0) > 255 ? 1 : .56), 0);
    const fs = Math.min(10.5, (w + pad * 2 - 4) / Math.max(1, ...lines.map(tw)));
    const lab = small ? "" : lines.map((t, i) => `<text x="${w / 2}" y="${w + 12 + i * (fs + 1)}" font-size="${fs.toFixed(1)}" text-anchor="middle" fill="var(--ink)" font-weight="700">${esc(t)}</text>`).join("");
    return `<g data-it="${id}" transform="translate(${x} ${y})"><rect x="${-pad}" y="-2" width="${w + pad * 2}" height="${w + 4 + (small ? 0 : 8 + lines.length * (fs + 1))}" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="1.5"/>
      <svg width="${w}" height="${w}" viewBox="${c[0]} ${c[1]} ${c[2]} ${c[3]}" preserveAspectRatio="xMidYMid meet"><image href="images/${it.img}" x="0" y="0" width="1" height="1" preserveAspectRatio="none"/></svg>${lab}</g>`;
  }
  function svgView(s){
    const th = trayRows(s) * 92, H = th + 240;
    let g = `<svg viewBox="0 0 360 ${H}" id="sv">`;
    (s.tray || []).forEach((id, i) => {
      if(!s.tool && S.placed[id]) return;
      const row = Math.floor(i / 5), inRow = Math.min(5, s.tray.length - row * 5), col = i % 5;
      g += itemG(id, 180 - inRow * (inRow <= 3 ? 46 : 36) + col * (inRow <= 3 ? 92 : 72) + (inRow <= 3 ? 17 : 7), 6 + row * 92, 58);
    });
    g += `<g transform="translate(0 ${th})">` + (scn(s) || `<image href="images/${S.img || s.bg}" x="0" y="0" width="360" height="240" preserveAspectRatio="xMidYMid slice"/>`);
    if(s.overlay) g += s.overlay(S);
    const after = S.ok && s.after;
    (after ? [] : s.zones || []).forEach(z => {
      const [x1, y1, x2, y2] = z.r, hit = s.tool ? S.hit.includes(z.id) : Object.values(S.placed).includes(z.id);
      const lw = Math.min(150, z.label.length * 10 + 14), lx = Math.max(2, Math.min(358 - lw, (x1 + x2) / 2 - lw / 2)), ly = y1 > 22 ? y1 - 19 : y2 + 3;
      if(z.pic) g += `<image href="images/${z.pic}" x="${x1}" y="${y1}" width="${x2 - x1}" height="${y2 - y1}" preserveAspectRatio="xMidYMid slice"/>`;
      g += `<g class="zone${hit ? " hit" : ""}"><rect class="z${hit ? "" : " pulse"}" x="${x1}" y="${y1}" width="${x2 - x1}" height="${y2 - y1}" rx="8"/>
        <rect x="${lx}" y="${ly}" width="${lw}" height="16" rx="8" fill="${hit ? "#1f9d55" : "rgba(20,30,35,.78)"}"/><text x="${lx + lw / 2}" y="${ly + 12}" font-size="10" text-anchor="middle" fill="#fff" font-weight="700">${hit ? "✓ " : ""}${esc(z.label)}</text></g>`;
    });
    if(!s.tool && !after && !s.noCard) Object.entries(S.placed).forEach(([id, zid]) => {
      const z = s.zones.find(q => q.id === zid); if(!z) return;
      const [x1, y1, x2, y2] = z.r, w = Math.min(x2 - x1, y2 - y1) - 10;
      g += s.fillPlace ? itemG(id, (x1 + x2 - w) / 2, (y1 + y2 - w) / 2, w, true) : itemG(id, x2 - 40, y1 + 3, 36, true);
    });
    (after ? [] : (s.spots || []).filter(p => !p.need || S.taps.includes(p.need))).forEach(p => {
      const k = S.taps.indexOf(p.id);
      /* 標籤位置 lp：下（預設）／up 上／left 左／right 右 */
      const lw = p.label.length * 10 + 12, lc = p.lp === "left" ? [p.x - 15 - lw / 2, p.y - 7] : p.lp === "right" ? [p.x + 15 + lw / 2, p.y - 7] : p.lp === "up" ? [p.x, p.y - 30] : [p.x, p.y + 15];
      g += `<g data-spot="${p.id}"><circle cx="${p.x}" cy="${p.y}" r="13" fill="${k >= 0 ? "#1f9d55" : "rgba(255,176,32,.35)"}" stroke="${k >= 0 ? "#fff" : "#ffb020"}" stroke-width="2.5" class="${k >= 0 ? "" : "pulse"}"/>
        <text x="${p.x}" y="${p.y + 4}" font-size="11" text-anchor="middle" fill="#fff" font-weight="900">${k >= 0 ? k + 1 : "?"}</text>
        <rect x="${lc[0] - lw / 2}" y="${lc[1]}" width="${lw}" height="15" rx="7" fill="rgba(20,30,35,.78)"/><text x="${lc[0]}" y="${lc[1] + 11}" font-size="9.5" text-anchor="middle" fill="#fff" font-weight="700">${esc(p.label)}</text></g>`;
    });
    return g + `</g></svg>`;
  }
  const scn = s => typeof s.scene === "function" ? s.scene(S) : s.scene;
  const imgView = s => `<img class="scene" src="images/${S.img || s.bg}" alt="">`;

  function draw(){
    const done = doneItems();
    $("#chk").innerHTML = checkTable(L.items, done, S.fin ? 0 : curItem());
    if(S.fin) return drawFin();
    const s = st();
    $("#task").innerHTML = `第 ${S.si + 1} / ${ST.length} 步　${s.task}`;
    const v = $("#view"), c = $("#ctrls");
    const useSvg = ["drag", "taps"].includes(s.type);
    if(s.type === "manip" && !S.pos) S.pos = JSON.parse(JSON.stringify(s.start));
    v.innerHTML = useSvg ? svgView(s) : s.type === "manip" ? `<svg viewBox="${s.vb || "0 0 360 240"}" id="sv">${s.render(S)}</svg>`
      : S.ok && s.okScene ? `<svg viewBox="0 0 360 240">${s.okScene}</svg>`
      : s.scene ? `<svg viewBox="${s.vb || "0 0 360 240"}">${scn(s)}</svg>` : imgView(s);
    let h = "";
    if(s.type === "mode") h = `<div class="opts">${s.opts.map(o => `<button class="opt" data-b="m:${o.id}"${S.ok ? " disabled" : ""}>${o.t}</button>`).join("")}</div>`;
    if(s.type === "choice"){
      S.ord = S.ord || shuffle(s.opts.map((_, i) => i));
      h = `<p style="margin:10px 0 0;font-weight:800">${s.q}</p><div class="opts">${S.ord.map(i => { const o = s.opts[i]; const cls = S.bad.includes(i) ? "bad" : S.ok && o.ok ? "ok" : ""; return `<button class="opt ${cls}" data-b="c:${i}"${S.ok || S.bad.includes(i) ? " disabled" : ""}>${o.pic ? `<img src="images/${o.pic}" alt="">` : ""}${o.svg ? `<svg viewBox="0 0 120 120">${o.svg}</svg>` : ""}<span>${o.t}</span></button>`; }).join("")}</div>`;
    }
    if(s.type === "seq"){
      S.ord = S.ord || shuffle(s.opts.map((_, i) => i));
      h = `<div class="seqline">${S.seq.length ? S.seq.map((id, i) => `<span>${i + 1}. ${s.opts.find(o => o.id === id).t}</span>`).join("") : `<span style="background:none;color:var(--sub)">依序點下面的動作 👇</span>`}</div>
        <div class="opts">${S.ord.map(i => { const o = s.opts[i]; return `<button class="opt${S.seq.includes(o.id) ? " ok" : ""}" data-b="s:${o.id}"${S.ok || S.seq.includes(o.id) ? " disabled" : ""}>${o.t}</button>`; }).join("")}</div>`;
    }
    if(s.type === "hold") h = `<div class="bar"><i style="width:${Math.round(S.hp * 100)}%"></i></div><div class="row" style="margin-top:10px"><button class="btn" id="holdb"${S.ok ? " disabled" : ""}>✋ ${s.label}</button><span class="muted">按住不放，進度條跑滿才放手</span></div>`;
    if(s.type === "rhythm"){
      const left = Math.max(0, (s.total || s.n * s.ml) - S.n * s.ml);
      h = `<div class="readout" style="margin-top:8px;font-weight:800">注射器剩 ${left} mL　·　已推 ${S.n} / ${s.n} 次</div><div class="bar"><i style="width:${Math.round(S.n / s.n * 100)}%"></i></div>
        <div class="row" style="margin-top:10px"><button class="btn" data-b="r:push"${S.ok ? " disabled" : ""}>💉 推</button><button class="btn ghost" data-b="r:stop"${S.ok ? " disabled" : ""}>✋ 停</button></div>`;
      if(s.beat && !S.ok) h += metHtml(s);
    }
    if(s.type === "pump" && !S.ok || (s.type === "pump" && S.pf.vtbi != null)){
      const f = k => S.pf[k] != null ? `<b>${S.pf[k]}</b>` : S.psel === k ? `<input id="pin" inputmode="decimal" placeholder="輸入數字">` : "— —";
      h = `<div class="order">📄 <b>練習用醫囑</b>（虛構）：${s.drug}　流速 <b>${s.order.rate} mL/hr</b>　預輸注總量 <b>${s.order.vtbi} mL</b></div>
        <div class="pump"><div class="scr"><div class="fld"><span>Rate (mL/hr)</span><span>${f("rate")}</span></div><div class="fld"><span>VTBI (mL)</span><span>${f("vtbi")}</span></div></div>
        <div class="row" style="margin-top:10px"><button class="btn" data-b="p:rate"${S.ok ? " disabled" : ""}>設定 Rate</button><button class="btn" data-b="p:vtbi"${S.ok ? " disabled" : ""}>設定 VTBI</button>${S.psel ? `<button class="btn gold" data-b="p:ok">確定</button>` : ""}</div></div>`;
    }
    if(s.type === "dose"){
      if(S.left == null) S.left = s.start;
      h = `<div class="readout" style="margin-top:8px;font-weight:800">注射器剩 ${S.left} mL</div><div class="bar"><i style="width:${Math.round(S.left / s.start * 100)}%"></i></div>
        <div class="row" style="margin-top:10px"><button class="btn" data-b="d:push"${S.ok ? " disabled" : ""}>💉 再推 ${s.by} mL</button><button class="btn ghost" data-b="d:stop"${S.ok ? " disabled" : ""}>✋ 停在這裡，保留下來</button></div>`;
    }
    if(s.btns && !S.ok) h += `<div class="row" style="margin-top:10px">${s.btns.map((b, i) => `<button class="btn warnb" data-b="x:${i}">${b.t}</button>`).join("")}</div>`;
    if(S.ok) h += `<div class="row" style="margin-top:12px"><button class="btn gold" data-b="next">${S.si + 1 >= ST.length ? "🏁 完成本站" : "下一步 ▶"}</button></div>`;
    handBtns(c, h, act);
    $("#fb").innerHTML = S.fb;
    if(mediaFor !== S.si){
      mediaFor = S.si;
      const m = s.media;
      $("#media").innerHTML = m ? `<div class="media"><b>${m.title}</b><div class="vids">${m.items.map(v => `<figure><video src="images/${v.src}" poster="images/${v.src.replace(/\.mp4$/, ".jpg")}" controls playsinline preload="metadata"${v.muted === false ? "" : " muted"}></video><figcaption>${v.cap}</figcaption></figure>`).join("")}</div>${m.note ? `<div class="note">${m.note}</div>` : ""}</div>` : "";
    }
    if(useSvg) wire(s);
    if(s.type === "manip" && !S.ok) wireManip(s);
    if(s.beat && !S.ok) wireMet(); else stopMet();
    if(s.type === "hold" && !S.ok) wireHold(s);
    const pin = $("#pin"); if(pin) pin.focus();
  }
  function drawFin(){
    labDone(L.id); confetti();
    $("#task").innerHTML = "🎉 本站完成！";
    $("#view").innerHTML = `<img class="scene" src="images/${L.finImg || ST[ST.length - 1].bg}" alt="">`;
    // 課程流程：前測 → 技術站 → 技術站自評（eval.html#labfb）→ 實體課練習；5 站都做完時主按鈕改成去填自評
    const allDone = LABS.every(l => DONE[l.id]);
    // 10/26 使用者：完成一站要有按鈕直接到下一站（依站序；最後一站時跳到還沒做的那一站）
    const li = LABS.indexOf(L), nx = LABS[li + 1] || (allDone ? null : LABS.find(l => !DONE[l.id]));
    const nxBtn = nx ? `<div class="row" style="margin-top:12px"><button class="btn gold" data-b="nxst">▶ 下一站：站 ${LABS.indexOf(nx) + 1}｜${nx.title}</button></div>` : "";
    handBtns($("#ctrls"), `${allDone ? `<div class="row" style="margin-top:12px"><a class="btn gold" style="text-decoration:none;text-align:center" href="eval.html#labfb">📝 5 站都完成了，填技術站自評 →</a></div>` : nxBtn}<div class="row" style="margin-top:12px"><button class="btn" data-b="again">🔁 再做一次</button><button class="btn ghost" data-b="list">← 回技術站清單</button></div>`, b => { if(b === "again"){ hist.length = 0; accN = 0; S = fresh(0); draw(); ctl.upd(); } else if(b === "nxst"){ location.hash = "/" + nx.id; window.scrollTo(0, 0); } else location.hash = ""; });
    $("#fb").innerHTML = say(`做完評核表第 ${L.items[0]}–${L.items[L.items.length - 1]} 項。這一站出事 <b>${accN}</b> 次${accN ? "——出事的地方，就是實際操作時要特別留意的地方。" : "，很棒！"}`, true);
  }

  /* ── 動作 ── */
  function act(b){
    if(ctl.paused) return;
    const s = st(), [k, v] = b.split(":");
    if(b === "next") return next();
    if(S.ok) return;
    if(k === "x") return bad(s.btns[+v]);
    if(k === "m"){ commit(() => { S.mode = v; finish(); S.fb = say("✅ " + s.opts.find(o => o.id === v).okMsg, true); }); return draw(); }
    if(k === "c"){
      const o = s.opts[+v];
      if(!o.ok){ if(o.acc) return bad({acc: o.acc}); commit(() => S.bad.push(+v)); beep(false); S.fb = say("⚠️ " + o.why); return draw(); }
      commit(() => { finish(); S.fb = say("✅ " + o.why + (s.item ? CHK_NO([].concat(s.item).join("、")) : ""), true) + (s.note ? `<div class="note">📝 教學補充：${s.note}</div>` : ""); if(s.after) S.img = s.after; });
      return draw();
    }
    if(k === "s"){
      const cand = S.seq.concat(v);
      if(s.orders.some(o => cand.every((x, i) => o[i] === x))){
        commit(() => { S.seq.push(v); if(s.orders.some(o => o.length === cand.length)){ finish(); if(s.after) S.img = s.after; } });
        beep(true, 660); return draw();
      }
      return bad((s.why || {})[v] || s.orderMsg || "順序不對，想想看這一步之前還要先做什麼。");
    }
    if(k === "r"){
      if(v === "met"){ if(metT) stopMet(); else startMet(); return draw(); }
      if(v === "push"){ if(S.last === "push") return bad(s.twice || "推完要停一下，再推——要「推-停-推-停」。"); commit(() => { S.n++; S.last = "push"; S.fb = ""; }); beep(true, 520); }
      else { if(S.last !== "push") return bad("先推一下，再停。"); commit(() => { S.last = "stop"; if(S.n >= s.n){ finish(); if(s.after) S.img = s.after; } }); beep(true, 700); }
      return draw();
    }
    if(k === "d"){
      if(v === "push"){
        const n = Math.round((S.left - s.by) * 10) / 10;
        if(n <= 0){ return bad(s.zero); }
        commit(() => { S.left = n; S.fb = ""; }); beep(true, 520); return draw();
      }
      if(S.left < s.keep[0] || S.left > s.keep[1]) return bad(s.keepMsg || "剩的量不對。");
      commit(() => finish()); return draw();
    }
    if(k === "p"){
      if(v === "ok"){
        const inp = $("#pin"), val = inp ? parseFloat(inp.value) : NaN, want = s.order[S.psel];
        if(val !== want) return bad(`輸入的數字和醫囑不同：醫囑的 ${S.psel === "rate" ? "Rate 是 " + want + " mL/hr" : "VTBI 是 " + want + " mL"}。`);
        commit(() => { S.pf[S.psel] = val; S.psel = ""; S.fb = ""; if(S.pf.rate != null && S.pf.vtbi != null) finish(); });
        return draw();
      }
      if(v === "vtbi" && S.pf.rate == null) return bad("設定順序為：Rate → Volume to be infusion (VTBI)，先設 Rate。");
      if(S.pf[v] != null) return;
      S.psel = v; return draw();
    }
  }
  function wire(s){
    const svg = $("#sv"), th = trayRows(s) * 92;
    handDnd(svg, {name: id => ITEMS[id].name.replace("\n", ""), drop(id, x, y){
      if(ctl.paused || S.ok) return;
      y -= th;
      const z = (s.zones || []).find(q => inR(x, y, q.r));
      if(!z){ if(S.placed[id]){ commit(() => delete S.placed[id]); S.fb = say("已把用物拿回上排。", true); draw(); } else draw(); return; }
      const G = goals(s), hit = G.find(g => g[0] === id && g[1] === z.id);
      const jw = s.judge ? s.judge(S, id, z.id) : undefined;
      if(jw) return bad(jw);
      if(!hit){ const W = s.wrong || {}; return bad(W[id + "@" + z.id] || W[id] || W["@" + z.id] || `「${ITEMS[id].name.replace("\n", "")}」不是放在「${z.label}」。`); }
      if(s.ordered){ const i = G.indexOf(hit); if(!G.slice(0, i).every(g => s.tool ? S.hit.includes(g[1]) : S.placed[g[0]] === g[1])) return bad((typeof s.orderMsg === "function" ? s.orderMsg(S) : s.orderMsg) || "順序不對。"); }
      if(s.tool ? S.hit.includes(z.id) : false) return draw();
      commit(() => {
        if(s.tool) S.hit.push(z.id); else S.placed[id] = z.id;
        S.fb = "";
        if(s.mid && s.mid[z.id]) S.img = s.mid[z.id];
        if(G.every(g => s.tool ? S.hit.includes(g[1]) : S.placed[g[0]] === g[1])){ finish(); if(s.after) S.img = s.after; }
      });
      beep(true, 660); draw();
    }});
    svg.addEventListener("click", e => {
      const p = e.target.closest("[data-spot]"); if(!p || ctl.paused || S.ok) return;
      const id = p.dataset.spot; if(S.taps.includes(id)) return;
      if(!tapNeed(s).includes(id)) return bad((s.why || {})[id] || s.orderMsg || "順序不對。");
      commit(() => { S.taps.push(id); S.fb = ""; if(s.tapImg && s.tapImg[id]) S.img = s.tapImg[id]; if(!tapNeed(s).length){ finish(); if(s.after) S.img = s.after; } });
      beep(true, 660); draw();
    });
  }
  /* manip：按住零件拖動，只重畫 SVG 內容；放手交給 s.drop 判斷 */
  function wireManip(s){
    const svg = $("#sv");
    const pt = e => { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
    let dr = null;
    svg.onpointerdown = e => {
      const el = e.target.closest("[data-part]"); if(!el || ctl.paused || S.ok) return;
      e.preventDefault(); svg.setPointerCapture(e.pointerId);
      const id = el.dataset.part, p = pt(e);
      dr = {id, snap: cur(), dx: S.pos[id].x - p.x, dy: S.pos[id].y - p.y};
    };
    svg.onpointermove = e => {
      if(!dr) return;
      const p = pt(e);
      s.move(S, dr.id, p.x + dr.dx, p.y + dr.dy);
      svg.innerHTML = s.render(S);
    };
    svg.onpointerup = svg.onpointercancel = () => {
      if(!dr) return;
      const d = dr; dr = null;
      const r = s.drop(S, d.id);
      if(r && r.acc){ S = JSON.parse(d.snap); return bad(r); }
      hist.push(d.snap); ctl.upd();
      if(r === true){ finish(); beep(true, 660); }
      else if(r){ beep(false); S.fb = say("⚠️ " + r); }
      draw();
    };
  }
  /* 推-停節拍聲：每一拍＝推一次；拍速記在瀏覽器 */
  let metT = null, BPM = 67;
  try{ BPM = +localStorage.getItem("chemo-lab-bpm2") || 67; }catch(e){}
  /* 節拍聲「滴答」（10/25 使用者）：推的開始「滴」（高、短）、停的開始「答」（低、短） */
  const click = (f, at) => { try{ AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const t = AC.currentTime + at, o = AC.createOscillator(), g = AC.createGain(); o.type = "triangle"; o.frequency.value = f; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.35, t + .004); g.gain.exponentialRampToValueAtTime(.0001, t + .06); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + .07); }catch(e){} };
  function stopMet(){ if(metT){ clearInterval(metT); metT = null; } }
  function startMet(){
    stopMet();
    const s = st(), pre = (s.beat || []).find(b => b.bpm === BPM), push = Math.min(pre ? pre.push : .5, 60 / BPM * .6);
    const tick = () => { if(ctl.paused) return; click(1800, 0); click(1100, push); const d = $("#metdot"); if(d){ d.classList.add("on"); setTimeout(() => d.classList.remove("on"), push * 1000); } };
    tick(); metT = setInterval(tick, 60000 / BPM);
  }
  const metHtml = s => `<div class="met"><div class="row"><button class="btn ghost" data-b="r:met">${metT ? "🔇 關掉節拍聲" : "🔊 播放節拍聲（聽到「滴」推、聽到「答」停）"}</button><span id="metdot" class="metdot"></span><b id="bpmv">${BPM} 次/分</b></div>
    <div class="row" style="margin-top:6px"><select id="bpmsel">${s.beat.map(b => `<option value="${b.bpm}"${b.bpm === BPM ? " selected" : ""}>${b.t}</option>`).join("")}<option value="0"${s.beat.some(b => b.bpm === BPM) ? "" : " selected"}>自訂（拉右邊滑桿）</option></select>
    <input type="range" id="bpmr" min="40" max="180" step="5" value="${BPM}" aria-label="每分鐘推幾次"></div><div class="note">${s.beatRef}</div></div>`;
  function wireMet(){
    const sel = $("#bpmsel"), r = $("#bpmr"); if(!sel) return;
    const set = v => { BPM = v; try{ localStorage.setItem("chemo-lab-bpm2", v); }catch(e){} $("#bpmv").textContent = v + " 次/分"; r.value = v; if(metT) startMet(); };
    sel.onchange = () => { if(+sel.value) set(+sel.value); };
    r.oninput = () => { set(+r.value); sel.value = [...sel.options].some(o => +o.value === +r.value) ? r.value : "0"; };
  }
  window.addEventListener("hashchange", stopMet, {once: true});
  function tapNeed(s){ for(const g of s.order){ const rem = [].concat(g).filter(x => !S.taps.includes(x)); if(rem.length) return rem; } return []; }
  function stopHold(){ if(holdT){ clearInterval(holdT); holdT = null; } }
  function wireHold(s){
    const b = $("#holdb"); if(!b) return;
    const start = e => { e.preventDefault(); if(S.ok || ctl.paused || holdT) return; holdT = setInterval(() => {
      if(ctl.paused) return;
      S.hp = Math.min(1, S.hp + 50 / s.ms); const bar = $("#view").parentNode.querySelector(".bar i"); if(bar) bar.style.width = Math.round(S.hp * 100) + "%";
      if(S.hp >= 1){ stopHold(); commit(() => { finish(); if(s.after) S.img = s.after; }); draw(); }
    }, 50); };
    const end = () => { if(!holdT) return; stopHold(); if(!S.ok){ S.hp = 0; bad(s.early || "放手太早了，要按住到進度條跑滿。"); } };
    b.onpointerdown = start; b.onpointerup = b.onpointerleave = b.onpointercancel = end;
    b.oncontextmenu = e => e.preventDefault();
  }
  draw(); ctl.upd();
}

/* ═════ 技術評核表〈到職訓練-化療靜脈給藥暨人工血管照護基礎技術〉21 項原文 ═════
   來源：腫瘤品管共用夾 @訓練班\…\115年 化療給藥單位新進護理師到職訓練課程\到職訓練_化療靜脈給藥暨人工血管照護基礎技術.pdf（掃描檔，人工轉錄）
   分段：組裝密閉系統藥品轉移裝置 1–3｜主護護理師執行給藥前準備 4–10｜換接相容輸液點滴 11–12｜角針置放 13–18｜角針移除 19–21 */
const CHECK = [

  "脫除外層手套(因上述操作步驟可能有化療藥品殘留在手套上)。",

  "將相容輸液點滴袋上CSTD的Spike與Adapter銜接，掛上點滴架。",
  "慣用手拿握Port-A角針握柄，以三點(拇指、食指、中指)持針法持針，使角針與Port-A盤面呈垂直對準圓盤下針處。",
  "觸摸Port-A圓盤邊緣，並以非慣用手大拇指、食指、中指用力固定盤面使盤面不致滑動。",
  "請病人深呼吸，將角針垂直快速插入圓盤底部，墊片下壓並平貼皮膚。(角針插入至底部後，勿再用力強壓，避免角針前端變鈍)",
  "打開管夾以10mL注射器反抽，測試是否通暢及回血，回血顏色須為全血。",

/* 10/25 晚：化療藥袋改用 ChatGPT 畫的去背物件圖 L09（直立、夾鏈封口在下方、Spike 從封口露出，Spike 底端在圖寬 0.509、圖底） */

const POLE = 250, EYE = 88, PUMP = [215, 174, 70, 34];

const SP_K = SPK_L * .55, AD_K = ADP_L * .55;
const lineTo = (x, y) => `<path d="M${x} ${y} C ${x} ${y + 30}, ${POLE} ${PUMP[1] - 30}, ${POLE} ${PUMP[1]}" fill="none" stroke="${C1.tubeS}" stroke-width="3"/>`;
const compBag = (cx, top) => `<path d="M${cx - 28} ${top} Q${cx} ${top - 6} ${cx + 28} ${top} L${cx + 30} ${top + 56} Q${cx} ${top + 70} ${cx - 30} ${top + 56} Z" fill="#eaf4fb" stroke="#8fb3c9" stroke-width="1.5"/>
  <rect x="${cx - 20}" y="${top + 12}" width="40" height="18" rx="2" fill="#fff" stroke="#b9c7d0"/><text x="${cx}" y="${top + 24}" font-size="7.5" text-anchor="middle" fill="${C1.txt}" font-weight="700">相容輸液</text>

/* 相容輸液點滴袋＋CSTD（Spike→Adapter）＋管路到幫浦；state：on 接著／open 旋開／gone 移除 */
function compSet(cx, top, state){
  const bot = top + 72, face = bot - 8 + SP_K, gap = state === "open" ? 12 : 0;
  let g = "";
  if(state !== "gone") g += vSpike(cx, bot - 8 - gap) + compBag(cx, top - gap);
  return g + vAdp(cx, face) + lineTo(cx, face + AD_K);
}
/* 化療藥袋物件：直立（Spike 朝下，(x, y)＝左上角）、橫躺（轉 -90°，Spike 朝右，(x, y)＝左上角，佔 ZH×ZW） */
const zipUp = (x, y) => `<image href="${ZIP}" x="${x}" y="${y}" width="${ZW}" height="${ZH}"/>`;
const zipLie = (x, y) => `<g transform="translate(${x} ${y + ZW}) rotate(-90)"><image href="${ZIP}" x="0" y="0" width="${ZW}" height="${ZH}"/></g>`;
const lieSpike = (x, y) => [x + ZH, y + ZW - ZSX];   // 橫躺時 Spike 底端位置

/* 「藥袋拖去接 Adapter → 接上後直立 → 拖到點滴架掛勾」的手動步驟（第 2 站第 9 步、第 3 站第 3 步共用）
   o：img 物件圖（直立、出口朝下）、w／h 直立時寬高、sx 出口在圖內的 x、ax／ay Adapter 接頭位置、home 橫躺在工作台的左上角、name 藥袋名稱 */
function hangStep(o){
  const up = (x, y) => `<image href="${o.img}" x="${x}" y="${y}" width="${o.w}" height="${o.h}"/>`;
  const lie = (x, y) => `<g transform="translate(${x} ${y + o.w}) rotate(-90)">${up(0, 0)}</g>`;
  const lieSp = (x, y) => [x + o.h, y + o.w - o.sx];

    render(S){
      const {bag, st} = S.pos;
      let g = bedside(false);

        g += vAdp(o.ax, o.ay) + lineTo(o.ax, o.ay + AD_K) + `<g data-part="bag">${lie(bag.x, bag.y)}${GRAB(bag.x, bag.y, o.h, o.w)}</g>`;

        return g + HINT(`按住${o.name}，把 Spike 接頭（橘圈）拖到 Adapter（橘圈）`, 180, 16);
      }
      const ax = bag.x + o.sx, ay = bag.y + o.h;
      g += vAdp(ax, ay) + lineTo(ax, ay + AD_K) + `<g data-part="bag">${up(bag.x, bag.y)}${GRAB(bag.x, bag.y, o.w, o.h)}</g>`;

      return g + HINT(`接好了！把${o.name}拖到點滴架掛勾 ⬆`, 180, 16);

      return null;
    },
    okMsg: o.okMsg};
}

    {type: "drag", bg: "I15.jpg", task: "（延伸，不在 21 項內）拔出的角針丟哪裡？", note: "出自 Port-A 角針移除查核表（15700-4-041712）第 15 項。",
      tray: ["NDL"], zones: [{id: "sharp", r: [252, 140, 358, 238], label: "尖銳物品收集器"}, {id: "bed", r: [14, 40, 120, 110], label: "先放病床上"}], goal: [["NDL", "sharp"]],
      wrong: {"@bed": "拔出之 Port-A 角針要隨即丟入尖銳物品收集器中，不要先放著。"}, okMsg: "拔出的角針隨即丟入尖銳物品收集器。"},
  ]});

function home(){
  $("#backlab").hidden = true; $("#app").style.maxWidth = $(".top .in").style.maxWidth = "";
  $("#pnum").textContent = `完成 ${LABS.filter(l => DONE[l.id]).length} / ${LABS.length} 站`;
  $("#app").innerHTML = `<header><div class="kicker">新進護理師到職訓練 · 動手做技術站</div><h1>🧪 化療靜脈給藥暨人工血管照護基礎技術</h1>
    <p class="muted">把用物拖到正確的位置（或先點用物、再點位置），照評核表一步一步做。做錯會出事——出事以後要先選對處理方法，才能回到出事前重做。每一站都有「⏸ 暫停」「↩ 上一步」「🔁 全部重來」，放錯的用物可以再拖回上排。</p></header>
    <div class="grid">${LABS.map(l => `<button class="xp" onclick="location.hash='#/${l.id}'"><span class="ic">${l.icon}</span><span><b>${esc(l.title)}</b><small>${esc(l.desc)}</small><small>評核表第 ${l.items[0]}–${l.items[l.items.length - 1]} 項${DONE[l.id] ? ' · <span class="done">✅ 做完了</span>' : ""}</small></span></button>`).join("")}</div>
    ${(() => { const left = LABS.filter(l => !DONE[l.id]);   // 5 站都做完才能填自評（10/25 使用者定）
      return `<div class="card" style="text-align:center"><b>${left.length ? "做完 5 站，才能填技術站自評" : "5 站都完成了！"}</b>
      <p class="muted">已完成 ${LABS.length - left.length} / ${LABS.length} 站。${left.length ? `還沒做：${left.map(l => esc(l.title)).join("、")}。` : ""}做完後請填<b>技術站自評</b>，寫下你需要老師協助的步驟，接著開始實體課練習。</p>
      ${left.length ? `<button class="btn" disabled style="opacity:.45;cursor:not-allowed">🔒 填技術站自評（還有 ${left.length} 站）</button>`
        : `<a class="btn gold" style="display:inline-block;text-decoration:none" href="eval.html#labfb">📝 填技術站自評 →</a>`}</div>` })()}
    <div class="card"><details><summary>📋 看評核表全部 21 項（原文）</summary>${checkTable(CHECK.map((_, i) => i + 1), new Set(), 0)}</details>
    <p class="note">※ 步驟文字照評核表原文。「出事」情境與處理題、每步的補充說明（標「教學補充」者）不是評核表原文，以院內規範與老師說明為準。</p></div>`;
}
function route(){
  const id = location.hash.replace(/^#\/?/, ""), L = LABS.find(l => l.id === id);
  window.scrollTo(0, 0);
  if(!L) return home();
  $("#backlab").hidden = false; $("#pnum").textContent = `評核表第 ${L.items[0]}–${L.items[L.items.length - 1]} 項`;
  $("#app").innerHTML = `<header><div class="kicker">動手做技術站</div><h1>${L.icon} ${esc(L.title)}</h1>
    <div class="laybar"><button class="btn ghost" data-lay="lr">⬌ 左右並排</button><button class="btn ghost" data-lay="tb">⬍ 上下排列</button>
      <label>頁面寬度 <input type="range" id="pw" min="360" max="2400" step="20"></label><button class="btn ghost" data-lay="reset">↺ 還原版面</button>
      <span class="muted" id="layhint"></span></div></header><div id="lpane"></div>`;
  runStation($("#lpane"), L);
  const p = $("#lpane"), sp = document.createElement("div");
  sp.className = "split"; sp.title = "拖曳調整大小（點兩下還原）";
  p.insertBefore(sp, p.children[1]);
  sp.onpointerdown = e => {
    e.preventDefault(); sp.setPointerCapture(e.pointerId); sp.classList.add("drag"); document.body.style.userSelect = "none";
    const r = p.getBoundingClientRect(), top = p.firstElementChild.getBoundingClientRect().top;
    sp.onpointermove = ev => {
      if(LAY.mode === "lr") LAY.wA = Math.round(Math.max(25, Math.min(80, (ev.clientX - r.left) / r.width * 100)));
      else LAY.hA = Math.round(Math.max(220, ev.clientY - top));
      applyLay();
    };
    sp.onpointerup = sp.onpointercancel = () => { sp.onpointermove = null; sp.classList.remove("drag"); document.body.style.userSelect = ""; saveLay(); };
  };
  sp.ondblclick = () => { if(LAY.mode === "lr") LAY.wA = 60; else LAY.hA = 0; applyLay(); saveLay(); };
  document.querySelectorAll("[data-lay]").forEach(b => b.onclick = () => {
    const v = b.dataset.lay;
    if(v === "reset") LAY = layDefault(); else LAY.mode = v;
    applyLay(); saveLay();
  });
  $("#pw").oninput = e => { LAY.pw[LAY.mode] = +e.target.value; applyLay(); };
  $("#pw").onchange = saveLay;
  applyLay();
}
/* 版面設定記在瀏覽器（每位使用者自己的） */
const LAY_KEY = "chemo-lab-layout";
const layDefault = () => ({mode: innerWidth >= 900 ? "lr" : "tb", wA: 60, hA: 0, pw: {lr: Math.min(1400, innerWidth), tb: 820}});
let LAY = layDefault();
try{ const o = JSON.parse(localStorage.getItem(LAY_KEY)); if(o && o.pw) LAY = Object.assign(LAY, o); }catch(e){}
function saveLay(){ try{ localStorage.setItem(LAY_KEY, JSON.stringify(LAY)); }catch(e){} }
function applyLay(){
  const p = $("#lpane"); if(!p) return;
  p.className = LAY.mode;
  p.style.setProperty("--wA", LAY.wA + "%");
  p.style.setProperty("--hA", LAY.hA ? LAY.hA + "px" : "auto");
  $("#app").style.maxWidth = $(".top .in").style.maxWidth = LAY.pw[LAY.mode] + "px";
  $("#pw").value = LAY.pw[LAY.mode];
  document.querySelectorAll("[data-lay]").forEach(b => b.classList.toggle("on", b.dataset.lay === LAY.mode));
  $("#layhint").textContent = LAY.mode === "lr" ? "拖中間的分隔條，調整左右寬度" : "拖中間的分隔條，調整上方操作區的高度";
}
$("#backlab").onclick = () => { location.hash = ""; };
window.addEventListener("hashchange", route); route();
</script>
