function seedOf(){
  const c = LS.get("eval_code",""); if(codeOK(c)) return "c"+c;
  let s = LS.get("eval_seed",""); if(!s){ s = "d"+Math.random().toString(36).slice(2,10); LS.set("eval_seed", s) }
  return s;
}
function orderFor(seed, i, n){
  let h = 2166136261; for(const ch of seed+"#"+i){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619)>>>0 }
  const r = () => { h = (h + 0x6D2B79F5)>>>0; let t = Math.imul(h ^ h>>>15, 1|h); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296 };
  const a = [...Array(n).keys()]; for(let k=n-1;k>0;k--){ const j = Math.floor(r()*(k+1)); [a[k],a[j]]=[a[j],a[k]] } return a;
}
function ordersFor(){
  const c = LS.get("eval_code",""), saved = codeOK(c) ? LS.get("eval_ord:"+c, null) : null;
  if(saved && saved.k && saved.a) return saved;
  const seed = seedOf();
  return {k: KQ.map((k,i)=>orderFor(seed, i, k.o.length)), a: KQA.map((k,i)=>orderFor(seed, 100+i, k.o.length))};
}
const letterOf = (ord, v) => "ABCD"[(ord||[0,1,2,3]).indexOf(v)] || "?";

// UMUX-Lite 原始分數（0–100）與換算的 SUS 分數（Lewis 等，2013）
const umux = u => ((u[0]-1)+(u[1]-1))/8*100;
const umuxSUS = u => 0.65*umux(u)+22.9;

/* 試算表每題一欄（10/25 使用者：eval 分頁要看到每題作答）：送出時把每題整理成「欄位名稱 → 答案」，
   後台遇到新欄位名稱會自動加在試算表最右邊。情境題記「選的字母＋選項原文」，另一欄對錯：1 對、0 錯、9 不確定 */
const SE_SHORT = ["CSTD組裝","給藥前準備","換接","角針置放","角針移除"];
function evalCols(p){
  const c = {};
  (p.se || []).forEach((v,i) => { c[`把握度${i+1}_${SE_SHORT[i]}`] = v });
  // 基本 10 題沿用 v1 的欄位名稱（情境1–10）；進階 3 題是新欄位，後台會加在試算表最右邊（10/28：舊欄位不動、只往後加）
  const put = (Q, v, i, k, ord) => {
    if(v == null) return;
    if(v === -1){ c[k] = "E. 不確定"; c[k+"_對錯"] = 9 }
    else { c[k] = `${letterOf(ord, v)}. ${Q[i].o[v]}`; c[k+"_對錯"] = v === Q[i].a ? 1 : 0 }
  };
  (p.answers || []).forEach((v,i) => put(KQ, v, i, `情境${i+1}(${KQ[i].step})`, p.order && p.order[i]));
  (p.adv_answers || []).forEach((v,i) => put(KQA, v, i, `進階${i+1}(${KQA[i].step})`, p.adv_order && p.adv_order[i]));
  if(p.adv != null) c["進階答對"] = p.adv;
  (p.l1 || []).forEach((v,i) => { c[`滿意度${i+1}`] = v });
  if(p.suggest != null) c["建議"] = p.suggest;
  if(p.gain != null) c["心得"] = p.gain;
  (p.cs || []).forEach((v,i) => { c[`關鍵${i+1}_${CS[i].split(" ")[0]}`] = v });
  if(p.note != null) c["評核備註"] = p.note;
  // 技術站自評（上課前）：每站 ZPD 記「1 自己做得到／2 需提醒或示範／3 還做不到」；使用感受 1–5 分
  const ZS = ["1 自己做得到","2 需提醒或示範","3 還做不到"];
  (p.zpd || []).forEach((v,i) => { c[`技術站${i+1}_ZPD`] = v == null ? "" : ZS[v] });
  (p.ux || []).forEach((v,i) => { c[`技術站感受${i+1}${i<2?"_UMUX":""}`] = v });
  if(p.need != null) c["需協助步驟"] = p.need;
  if(p.improve != null) c["技術站想改"] = p.improve;
  return c;
}

/* ---------- 共用 ---------- */
const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}` };
const LS = { get(k,d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d }catch(e){ return d } },
             set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} } };
// 代碼正規化：全形轉半形、去空白、轉大寫、各種橫線統一
function normCode(s){
  return String(s||"").replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/\s+/g,"").replace(/[‐-―－—–_]/g,"-").toUpperCase();
}
const codeOK = c => /^\d{6}$/.test(c);
const score = ans => KQ.reduce((n,k,i) => n + (ans[i]===k.a ? 1 : 0), 0);
const scoreA = ans => KQA.reduce((n,k,i) => n + (ans[i]===k.a ? 1 : 0), 0);
const mean = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : NaN;
const f1 = x => isNaN(x) ? "—" : x.toFixed(1);
const pct = x => isNaN(x) ? "—" : Math.round(x*100)+"%";

async function send(payload){
  payload.version = VERSION; payload.submitted_at = new Date().toISOString();
  payload.submission_id = payload.kind + "-" + Date.now() + "-" + Math.random().toString(36).slice(2,8);
  payload.cols = evalCols(payload);
  const local = LS.get("eval_local", []); local.push(payload); LS.set("eval_local", local);   // 本機留底
  if(!ENDPOINT) return {ok:true, local:true};
  try{
    const r = await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload),redirect:"follow"});
    return await r.json();
  }catch(e){
    try{ await fetch(ENDPOINT,{method:"POST",mode:"no-cors",body:JSON.stringify(payload)}); return {ok:true} }catch(x){ return {ok:false, error:String(x)} }
  }
}

  const optsHTML = (k, ord, name) => `<div class="opts">${ord.map((oi,j)=>`<label class="opt" data-n="${name}"><input type="radio" name="${name}" value="${oi}"><span>${"ABCD"[j]}. ${esc(k.o[oi])}</span></label>`).join("")}

    <button class="back" onclick="location.hash=''">← 回首頁</button>

    ${KQ.map((k,i)=>`<div class="card" id="kq${i}"><p class="q"><span class="qn">${i+1}.</span>${esc(k.q)}</p>${optsHTML(k, ORD.k[i], "kq"+i)}</div>`).join("")}
    <div class="sec">三、進階題（3 題，單選）</div>
    <div class="muted" style="margin:-4px 0 10px">問例外情況、理由、另一種正確做法；不知道就選「不確定」。</div>
    ${KQA.map((k,i)=>`<div class="card" id="ka${i}"><p class="q"><span class="qn">${i+1}.</span>${esc(k.q)}</p>${optsHTML(k, ORD.a[i], "ka"+i)}</div>`).join("")}

    ${L1.map((s,i)=>`<div class="card"><p class="q"><span class="qn">${i+1}.</span>${esc(s)}</p>${scaleHTML("l1"+i, L1_ANCHOR)}</div>`).join("")}

    <div class="card"><p class="q">本次到職訓練的自我收穫或心得（選填）</p><textarea id="gain"></textarea></div>`:""}
    <div id="msg"></div>
    <button class="pri" id="go" style="width:100%">送出${isPost?"後測":"前測"}</button>`;
  bindSel();
  document.getElementById("go").onclick = async () => {
    const code = readCode("code"); if(!code) return;
    const val = n => { const r=document.querySelector(`input[name="${n}"]:checked`); return r ? +r.value : null };
    const se = SE.map((_,i)=>val("se"+i)), ans = KQ.map((_,i)=>val("kq"+i)), adv = KQA.map((_,i)=>val("ka"+i));
    const l1 = isPost ? L1.map((_,i)=>val("l1"+i)) : [];
    const miss = [...se.map((v,i)=>v==null?`把握度第 ${i+1} 題`:null), ...ans.map((v,i)=>v==null?`情境題第 ${i+1} 題`:null), ...adv.map((v,i)=>v==null?`進階題第 ${i+1} 題`:null), ...l1.map((v,i)=>v==null?`課程回饋第 ${i+1} 題`:null)].filter(Boolean);

// 逐題解說（後測結果頁）：依這個人的選項順序排，標出正解與他的答案
function explainHTML(Q, ans, ords, preAns){
  return Q.map((k,i)=>{
    const mine = ans[i], ok = mine===k.a, ord = (ords&&ords[i])||[0,1,2,3], preOk = preAns ? preAns[i]===k.a : null;
    return `<div class="card"><p class="q"><span class="qn">${i+1}.</span>${esc(k.q)}
      <span class="${ok?"pass":"fail"}" style="margin-left:6px">${ok?"答對":(mine===-1?"不確定":"答錯")}</span>${preOk==null?"":`<span class="muted">（前測${preOk?"答對":(preAns[i]===-1?"不確定":"答錯")}）</span>`}</p>
      <div class="opts">${ord.map((oi,j)=>`<div class="opt ${oi===k.a?"right":(oi===mine?"wrong":"")}"><span>${"ABCD"[j]}. ${esc(k.o[oi])}${oi===k.a?" ✔":""}${oi===mine&&!ok?"（你的答案）":""}</span></div>`).join("")}${mine===-1?`<div class="opt wrong"><span>E. 不確定（你的答案）</span></div>`:""}</div>

    // eval-v2 新增欄位一律加在最後（10/28）
    "pre_version","post_version","pre_adv","post_adv", ...KQA.map((_,i)=>`pre_a${i+1}`), ...KQA.map((_,i)=>`post_a${i+1}`)];
  const lines = [head.join(",")];
  codes.forEach(c => {
    const a=pre[c], b=post[c], k=chk[c], z=lab[c], ok=(p,i)=>p?(p.answers[i]===-1?9:(p.answers[i]===KQ[i].a?1:0)):"";
    const okA=(p,i)=>p&&p.adv_answers?(p.adv_answers[i]===-1?9:(p.adv_answers[i]===KQA[i].a?1:0)):"";
    const r = [c, a?.session??"", b?.session??"", a?.know??"", b?.know??"", a?a.answers.filter(v=>v===-1).length:"", b?b.answers.filter(v=>v===-1).length:"",
      ...SE.map((_,i)=>a?.se[i]??""), ...SE.map((_,i)=>b?.se[i]??""),
      ...KQ.map((_,i)=>ok(a,i)), ...KQ.map((_,i)=>ok(b,i)),
      ...CS.map((_,i)=>k?.cs[i]??""), ...L1.map((_,i)=>b?.l1?.[i]??""), b?.suggest??"", b?.gain??"", k?.note??"",
      ...LAB_ST.map((_,i)=>z?z.zpd[i]+1:""), ...UX.map((_,i)=>z?.ux[i]??""), z?umuxSUS(z.ux).toFixed(1):"", z?.need??"", z?.improve??"",
      a?.version??"", b?.version??"", a?.adv??"", b?.adv??"", ...KQA.map((_,i)=>okA(a,i)), ...KQA.map((_,i)=>okA(b,i))];
    lines.push(r.map(v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g,'""')}"` : v).join(","));
  });
  const blob = new Blob(["﻿"+lines.join("\r\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `訓練成效_${today()}.csv`; a.click();
}
function demoRows(){
  // 假資料：12 人前後測＋10 人評核
  let s = 7; const rnd = () => (s = (s*9301+49297)%233280)/233280;
  const rows = [];
  for(let n=0;n<12;n++){
    const code = String(120100+n*37).padStart(6,"0");
    const mk = (kind, p, se) => { const answers = KQ.map(k => rnd()<p ? k.a : (rnd()<.5 ? -1 : (k.a+1)%4)), adv_answers = KQA.map(k => rnd()<p-.2 ? k.a : (rnd()<.5 ? -1 : (k.a+1)%4));
      return {kind, code, session:today(), version:VERSION, se:SE.map(()=>Math.max(1,Math.min(5,Math.round(se+rnd()*1.4-0.7)))), answers, know:score(answers), adv_answers, adv:scoreA(adv_answers),
        order:KQ.map((k,i)=>orderFor("c"+code, i, 4)), adv_order:KQA.map((k,i)=>orderFor("c"+code, 100+i, 4)), submitted_at:new Date().toISOString()} };
    rows.push(mk("pre", .55, 2.3));
    if(n<11){ const p = mk("post", .9, 4); p.l1 = L1.map(()=>rnd()<.6?5:4); if(n%4===0) p.gain="更清楚 CSTD 拆接時要注意的地方。"; rows.push(p) }
    rows.push({kind:"lab", code, session:today(), zpd:LAB_ST.map((_,i)=>{ const r=rnd(); return r<(i>=3?.3:.55)?0:(r<.88?1:2) }),
      ux:UX.map(()=>rnd()<.55?5:4), need: n%3===0 ? "站 4 三指固定時盤面會滑動，角針角度抓不準" : "", improve: n%5===0 ? "拖拉的用物卡在手機上有點小" : "", submitted_at:new Date().toISOString()});
    if(n<10) rows.push({kind:"check", code, session:today(), cs:CS.map(()=>rnd()<.82?1:0), submitted_at:new Date().toISOString()});
  }
  return rows;
}
