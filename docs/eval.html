<style>

  color-scheme:light;

  --s1:#0b3c5d; --s2:#9aa9b6; --accent:#0b3c5d; --accent2:#155a8a; --soft:#e7eef4; --ok:#1e8449; --ok-bg:#e8f5ec; --ng:#c0392b; --ng-bg:#fbeceb;
  --warn-bg:#fdf3e1; --warn:#7a4f00; --bar:#0b3c5d; --bar-ink:#ffffff; --r:6px;
}
@media (prefers-color-scheme:dark){

    color-scheme:dark;

    --s1:#5aa2d6; --s2:#4b5b6a; --accent:#5aa2d6; --accent2:#7db7e0; --soft:#1a2b3b; --ok:#4cc27e; --ok-bg:#132a1d; --ng:#ef7b6e; --ng-bg:#2e1a18;
    --warn-bg:#2e2510; --warn:#f1c25a; --bar:#0a2236; --bar-ink:#e6ecf1; --r:6px;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1720; --card:#17212c; --ink:#e6ecf1; --ink2:#b4c0cb; --muted:#8796a3; --line:#2a3744; --grid:#223040;

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif}

button.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.pri:hover{background:var(--accent2)}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}

.tblwrap{overflow-x:auto}
.pass{color:var(--ok);font-weight:600}.fail{color:var(--ng);font-weight:600}
.back{background:none;border:none;color:var(--accent);padding:0;min-height:0;margin-bottom:6px}

<body>
<header class="topbar"><div><b>化療靜脈給藥暨人工血管照護</b>｜訓練成效評估<span>腫瘤品管｜新進護理師到職訓練</span></div></header>

<script>
/* 到職訓練｜化療靜脈給藥暨人工血管照護 訓練成效評估（Kirkpatrick L1＋L2）
   規格：vault 20_教學\Makar\40_新進護理師到職訓練XR\13_訓練成效評估表_規格_v1.md（改題目時兩邊一起改）
   ENDPOINT：與 index.html 相同的 Apps Script 網址；空白時資料只存在本機瀏覽器（測試用）。
   結果頁網址加 ?demo=1 可看假資料。 */
const ENDPOINT = "https://script.google.com/macros/s/AKfycbzHpVJHrzP-dC0UWTtxjLVG7BKCxPn28-WUCjH69VMhk4u8_SnFYLZkJcPTmvwgMsaA/exec";
const VERSION = "eval-v1";

// 把握度（自我效能）：依技術表 5 個區段
const SE = [
  "組裝密閉系統藥品轉移裝置（CSTD）",
  "給藥前準備（防護裝備、病人辨識、條碼檢核）",
  "化療藥袋與相容輸液的換接",
  "Port-A 角針置放與回血測試",
  "Port-A 角針移除與正壓封管",
];
const SE_ANCHOR = ["完全沒把握","不太有把握","普通","有把握","非常有把握"];

// 知識題：a＝正解在 o 的索引（畫面上選項會固定打亂，前後測順序相同）
const KQ = [
  {step:"#3", q:"CSTD 的 Spike 戳入生理食鹽水點滴橡皮塞後，你看到橡皮塞下方還有液體殘留。下一步最適當的是？",
   o:["不影響，繼續組裝","先處理到橡皮塞下方無液體殘留再繼續","拔出 Spike 重新戳一次","等換接化療藥品時再處理"], a:1,
   ex:"技術表第 3 項要求確認橡皮塞下方無液體殘留；殘留液體在拆接時可能滴出。"},
  {step:"#4", q:"主護準備掛上化療藥品，下列哪一組防護裝備穿戴正確？",
   o:["防水隔離衣＋單層手套＋外科口罩","防水隔離衣（後開式、長袖、袖口可束緊）＋雙層手套套住袖口＋外科口罩＋護目鏡","前開式隔離衣＋雙層手套塞在袖口內＋N95＋護目鏡","隔離衣＋雙層手套＋外科口罩（不必護目鏡）"], a:1,
   ex:"後開式、長袖、袖口可束緊的防水隔離衣；雙層丁腈膠或乳膠手套需套住袖口；外科口罩；護目鏡或防護面罩。"},
  {step:"#6", q:"病房使用「輸液幫浦連線」功能，給化療藥前的條碼掃描應包含？",
   o:["病人手圈＋化療藥袋標籤","幫浦＋病人手圈＋化療藥袋標籤","幫浦＋化療藥袋標籤","病人手圈＋幫浦"], a:1,
   ex:"連線情境掃描幫浦、病人手圈、化療藥袋三個條碼；非連線情境才只掃手圈與藥袋，且要手動設定 Rate→VTBI。"},
  {step:"#7／#11", q:"化療藥滴完，要旋開 CSTD 的 Spike 與 Adapter 移除化療藥袋。藥袋應放在哪裡？為什麼？",
   o:["留在點滴架上，比較穩","放低於眼睛，若有滴漏不會濺到眼睛","舉高過頭，讓管內殘液流乾淨","放在病人床上，方便操作"], a:1,
   ex:"拆接時把藥袋放低於眼睛，萬一滴漏或噴濺不會濺到眼睛。"},
  {step:"#9", q:"化療藥袋與 CSTD 的 Adapter 銜接完、掛上點滴架後，接著要設定幫浦。下一步應先？",
   o:["直接按幫浦","脫除外層手套，因外層可能沾到藥品","脫除兩層手套並洗手","用酒精棉擦拭手套後繼續"], a:1,
   ex:"前面的操作可能讓化療藥品殘留在外層手套上，先脫除外層再碰幫浦，避免污染環境。"},
  {step:"#16", q:"角針置放後用 10 mL 注射器反抽，抽出淡粉紅色、像被稀釋的液體。下一步？",
   o:["有回血就好，開始給藥","繼續反抽確認為全血，未確認前不給藥","用力推注 NS 通管後直接給藥","拔針重戳"], a:1,
   ex:"回血顏色須為全血；稀釋血不能確認針尖在圓盤內、導管通暢，此時給化療藥有外滲風險。"},
  {step:"#8", q:"化療藥袋送到病房時裝在塑膠夾鏈袋內，銜接 CSTD 時應怎麼做？",
   o:["取出藥袋再銜接，較好操作","不取出，只露出 Spike 與 Adapter 銜接，連夾鏈袋掛上點滴架","取出藥袋，夾鏈袋丟化療廢棄物桶","剪開夾鏈袋底部再銜接"], a:1,
   ex:"夾鏈袋是第二層防護，藥袋破損或滴漏時可以接住藥品。"},
  {step:"#15", q:"角針垂直插入 Port-A，已感覺碰到圓盤底部。接下來應？",
   o:["再用力壓一下，確保插牢","不再用力強壓，墊片下壓平貼皮膚","稍微旋轉角針找最順的角度","往外拉一點留空間"], a:1,
   ex:"插到底後再強壓會使角針前端變鈍，鈍針可能損傷 Port-A 的矽膠膜。"},
  {step:"#17", q:"測完回血後用 10 mL NS 沖管，為什麼要用「推-停-推-停」？",
   o:["減少病人疼痛","產生擾流，把管壁殘留的血液沖乾淨","控制速度避免管路破裂","確認角針有沒有在圓盤內"], a:1,
   ex:"間歇推注產生擾流，比連續推注更能把管壁殘留的血液沖乾淨。"},
  {step:"#18", q:"下列哪一種是正確的正壓封管？",
   o:["NS 全部推完，先移除注射器再關管夾","保留 NS 0.5–1 mL，關閉管夾後緩慢移除注射器","NS 推完後放開活塞，再關管夾","不必關管夾，直接接上輸液"], a:1,
   ex:"封管時讓管內維持正壓，避免血液回流造成堵塞；另一種方法是大拇指壓住活塞後關管夾，再移除注射器。"},
];
// 每題選項的固定顯示順序（同一題前後測一致）
const ORDER = [[2,1,0,3],[0,3,1,2],[3,0,2,1],[1,2,3,0],[2,0,1,3],[0,2,3,1],[3,1,0,2],[1,3,2,0],[0,1,3,2],[2,3,1,0]];

// 關鍵步驟一次通過（評核教師勾）
const CS = [
  "#3 戳入後橡皮塞下方無液體殘留",
  "#4 個人防護裝備穿戴完整",
  "#6 條碼檢核（幫浦／手圈／藥袋）",
  "#7／#11 拆接 CSTD 時藥袋低於眼睛",
  "#9 銜接後脫除外層手套",
  "#16 回血確認為全血",
];

// 滿意度：沿用護理部評值表原文
const L1 = [
  "課程內容符合我的期待",
  "講者表達清晰",
  "課程有助我的個人成長",
  "課程有助我的工作提升",
  "整體而言，我對本課程感到滿意",
  "我認為此次職前訓練對我進入工作的適應有很大幫助",
  "我認為此次新進護理人員職前訓練課程之內容可符合臨床實務需求",
];
const L1_ANCHOR = ["非常不同意","不同意","尚可","同意","非常同意"];

/* ---------- 共用 ---------- */
const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}` };
const LS = { get(k,d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d }catch(e){ return d } },
             set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} } };
// 代碼正規化：全形轉半形、去空白、轉大寫、各種橫線統一
function normCode(s){
  return String(s||"").replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/\s+/g,"").replace(/[‐-―－—–_]/g,"-").toUpperCase();
}
const codeOK = c => /^\d{6}$/.test(c);
const score = ans => KQ.reduce((n,k,i) => n + (ans[i]===k.a ? 1 : 0), 0);
const mean = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : NaN;
const f1 = x => isNaN(x) ? "—" : x.toFixed(1);
const pct = x => isNaN(x) ? "—" : Math.round(x*100)+"%";

async function send(payload){
  payload.version = VERSION; payload.submitted_at = new Date().toISOString();
  payload.submission_id = payload.kind + "-" + Date.now() + "-" + Math.random().toString(36).slice(2,8);
  const local = LS.get("eval_local", []); local.push(payload); LS.set("eval_local", local);   // 本機留底
  if(!ENDPOINT) return {ok:true, local:true};
  try{
    const r = await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload),redirect:"follow"});
    return await r.json();
  }catch(e){
    try{ await fetch(ENDPOINT,{method:"POST",mode:"no-cors",body:JSON.stringify(payload)}); return {ok:true} }catch(x){ return {ok:false, error:String(x)} }
  }
}

/* ---------- 路由 ---------- */
function route(){
  const h = location.hash.replace("#","");
  ({pre:()=>quiz("pre"), post:()=>quiz("post"), check:checkForm, result:resultPage}[h] || home)();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);

function home(){
  $app.className="";
  $app.innerHTML = `
    <h1>化療靜脈給藥暨人工血管照護｜訓練成效評估</h1>
    <div class="sub">新進護理師到職訓練。請依老師指示選擇要填的項目。</div>
    <div class="tiles">
      <button class="tile" onclick="location.hash='pre'"><b>前測</b><span>上課前填。把握度 5 題＋情境題 10 題，約 5 分鐘。</span></button>
      <button class="tile" onclick="location.hash='post'"><b>後測</b><span>課程結束後填。同樣的題目＋課程回饋，送出後可看前後對照與解說。</span></button>
      <button class="tile" onclick="location.hash='check'"><b>評核教師</b><span>技術評核時勾選 6 項關鍵步驟是否第一次就做對。</span></button>
      <button class="tile" onclick="location.hash='result'"><b>成效結果</b><span>老師查看前後測配對結果、匯出資料（需密碼）。</span></button>
    </div>`;
}

/* ---------- 代碼區塊 ---------- */
function codeBlock(id){
  const last = LS.get("eval_code","");
  return `<div class="card">
    <h2>員工編號</h2>
    <div class="sub" style="margin-bottom:8px">請填 <b>6 碼數字</b>。前測、後測要填同一個編號，系統才能配對。</div>
    <input type="text" id="${id}" value="${esc(last)}" placeholder="例：012345" autocomplete="off" inputmode="numeric" maxlength="6">
    <div class="muted" id="${id}_msg" style="margin-top:4px"></div>
  </div>`;
}
function readCode(id){
  const c = normCode(document.getElementById(id).value);
  const m = document.getElementById(id+"_msg");
  if(!codeOK(c)){ m.innerHTML = `<span class="fail">員工編號要是 6 碼數字，例如 012345。</span>`; document.getElementById(id).focus(); return null }
  LS.set("eval_code", c); return c;
}

/* ---------- 前測／後測 ---------- */
function scaleHTML(name, anchor){
  return `<div class="scale">${[1,2,3,4,5].map(v=>`<label data-n="${name}"><input type="radio" name="${name}" value="${v}"><b>${v}</b></label>`).join("")}</div>
          <div class="anchor"><span>1 ${anchor[0]}</span><span>5 ${anchor[4]}</span></div>`;
}
function quiz(kind){
  $app.className="";
  const isPost = kind==="post";
  $app.innerHTML = `

}

function exportCSV(pre, post, chk){
  const codes = [...new Set([...Object.keys(pre), ...Object.keys(post), ...Object.keys(chk)])].sort();
  const head = ["emp_id","pre_session","post_session","pre_know","post_know","pre_unsure","post_unsure",
    ...SE.map((_,i)=>`pre_se${i+1}`), ...SE.map((_,i)=>`post_se${i+1}`),
    ...KQ.map((_,i)=>`pre_k${i+1}`), ...KQ.map((_,i)=>`post_k${i+1}`),
    ...CS.map((_,i)=>`cs${i+1}`), ...L1.map((_,i)=>`l1_${i+1}`), "suggest","gain","check_note"];
  const lines = [head.join(",")];
  codes.forEach(c => {
    const a=pre[c], b=post[c], k=chk[c], ok=(p,i)=>p?(p.answers[i]===-1?9:(p.answers[i]===KQ[i].a?1:0)):"";
    const r = [c, a?.session??"", b?.session??"", a?.know??"", b?.know??"", a?a.answers.filter(v=>v===-1).length:"", b?b.answers.filter(v=>v===-1).length:"",
      ...SE.map((_,i)=>a?.se[i]??""), ...SE.map((_,i)=>b?.se[i]??""),
      ...KQ.map((_,i)=>ok(a,i)), ...KQ.map((_,i)=>ok(b,i)),
      ...CS.map((_,i)=>k?.cs[i]??""), ...L1.map((_,i)=>b?.l1?.[i]??""), b?.suggest??"", b?.gain??"", k?.note??""];
    lines.push(r.map(v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g,'""')}"` : v).join(","));
  });
  const blob = new Blob(["﻿"+lines.join("\r\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `訓練成效_${today()}.csv`; a.click();
}
function demoRows(){
  // 假資料：12 人前後測＋10 人評核
  let s = 7; const rnd = () => (s = (s*9301+49297)%233280)/233280;
  const rows = [];
  for(let n=0;n<12;n++){
    const code = String(120100+n*37).padStart(6,"0");
    const mk = (kind, p, se) => { const answers = KQ.map(k => rnd()<p ? k.a : (rnd()<.5 ? -1 : (k.a+1)%4));
      return {kind, code, session:today(), se:SE.map(()=>Math.max(1,Math.min(5,Math.round(se+rnd()*1.4-0.7)))), answers, know:score(answers), submitted_at:new Date().toISOString()} };
    rows.push(mk("pre", .55, 2.3));
    if(n<11){ const p = mk("post", .9, 4); p.l1 = L1.map(()=>rnd()<.6?5:4); if(n%4===0) p.gain="更清楚 CSTD 拆接時要注意的地方。"; rows.push(p) }
    if(n<10) rows.push({kind:"check", code, session:today(), cs:CS.map(()=>rnd()<.82?1:0), submitted_at:new Date().toISOString()});
  }
  return rows;
}
route();
</script>
